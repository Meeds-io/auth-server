oauth.administration.clientsSelfRegistrationDCR.title=用于客户端注册的 {0}DCR 重定向 URL{1}
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR 重定向 URL
oauth.administration.clientsSelfRegistrationDCR.tooltip=什么是 DCR 重定向 URL？
oauth.administration.clientsSelfRegistrationDCR.description=定义新客户端使用 DCR 注册时允许使用哪些重定向 URL。\n\n任何包含未在此列出的重定向 URL 的客户端注册请求都将被拒绝。\n这有助于确保只有受信任的应用端点才能在系统中注册。\n\n每个 URL 必须：\n- 完全匹配（包括协议、域和路径）\n- 使用 HTTPS（已批准的开发环境除外）\n\nℹ️ 注意：此列表仅在客户端注册期间使用。它不会自动定义现有客户端的重定向 URL。
oauth.administration.clientsSelfRegistrationDCR.inputTitle=重定向 URL 输入
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=请输入要允许的重定向 URL 前缀
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=确认添加重定向 URL
oauth.administration.clientsSelfRegistrationDCR.allowAny=允许任何 URL
oauth.administration.clientsSelfRegistrationDCR.saved=重定向 URL 已成功保存
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=重定向 URL 已存在
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=移除允许的重定向 URL
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>高风险配置</strong>。\n\n禁用重定向 URI 验证将允许任何客户端接收授权响应。\n这可能导致账户被盗用和令牌泄露。\n\n👉 <strong>建议</strong>：改为定义明确的重定向 URI 前缀。
oauth.administration.clientsSelfRegistrationCIMD.title=客户端注册允许的 {0}CIMD URL{1}
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.tooltip=什么是 CIMD 客户端注册？
oauth.administration.clientsSelfRegistrationCIMD.description=定义如何使用 CIMD（Client Initiated Metadata）链接注册新的 OAuth 客户端。\nCIMD 客户端注册请求可通过基于 OAuth 的安全链接动态创建新的客户端应用。\n任何不符合所需参数或策略的注册请求都将被拒绝。\n这有助于确保只有受信任且配置正确的客户端应用才能在系统中注册。每个请求必须：\n\n- 包含所有必需的客户端元数据（例如重定向 URL、范围）\n- 遵守已配置的安全和验证规则\n- 来自受信任或已授权的来源\n\nℹ️ 注意：CIMD 注册仅在客户端接入时使用。客户端创建后，它不会修改或更新现有客户端。
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD 客户端注册 URL
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD 客户端注册 URL 前缀
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=确认添加 CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny=允许任何 URL
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL 已成功保存
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL 已存在
oauth.administration.clientsSelfRegistrationCIMD.delete=删除 CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=移除允许的 CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>高风险配置</strong>。\n\n允许任何 CIMD URL 意味着可以从不受信任的位置加载客户端元数据。\n这可能导致恶意客户端注册、元数据伪造或不安全的 OAuth 行为。\n\n👉 <strong>建议</strong>：仅允许指向受信任域的 CIMD URL 前缀。
oauth.administration.clientsAllowedCorsOrigins.title=允许{0}浏览器访问{1}的网站
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS 源
oauth.administration.clientsAllowedCorsOrigins.tooltip=什么是 CORS 源？
oauth.administration.clientsAllowedCorsOrigins.description=定义允许哪些网站向此服务发起基于浏览器的请求。\n浏览器只接受来自这些域的请求。这可防止您的 API 被不受信任的 Web 应用调用。\n每个源必须：\n- 仅包含协议 + 域 + 端口（不含路径）\n- 使用 HTTPS（已启用的本地开发除外）\n\nℹ️ 注意：这些设置的用途\n\n- 允许的重定向 URL（上方）→ 筛选客户端注册期间允许使用的重定向 URL\n- 允许的 CORS 源 → 控制哪些网站可以从浏览器调用 API\n\n这些设置独立于各客户端的配置，作为全局安全规则生效。
oauth.administration.clientsAllowedCorsOrigins.inputTitle=CORS 源输入
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=添加 CORS 源
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=确认添加源 URL
oauth.administration.clientsAllowedCorsOrigins.allowAny=允许任何源
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=CORS 源已自动允许，以符合允许所有重定向 URL 的规则
oauth.administration.clientsAllowedCorsOrigins.delete=删除源 URL
oauth.administration.clientsAllowedCorsOrigins.saved=源已成功保存
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=源已存在
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=继承自现有重定向 URL 的允许请求源规则
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=移除允许的源
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>高风险配置</strong>。\n\n允许任何 CORS 源意味着任意域都可以从浏览器向 OAuth 端点发起请求。这可能使不受信任的 Web 应用参与 OAuth 流程，并增加令牌泄露或滥用的风险。\n\n👉 <strong>建议</strong>：仅允许受信任的应用域作为源。
