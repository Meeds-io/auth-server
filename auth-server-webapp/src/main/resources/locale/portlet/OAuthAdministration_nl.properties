oauth.administration.clientsSelfRegistrationDCR.title={0}DCR-redirect-URL's{1} voor clientregistratie
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR-redirect-URL's
oauth.administration.clientsSelfRegistrationDCR.tooltip=Wat is een DCR-redirect-URL?
oauth.administration.clientsSelfRegistrationDCR.description=Bepaalt welke redirect-URL's zijn toegestaan wanneer een nieuwe client zich registreert via DCR.\n\nElk clientregistratieverzoek met een redirect-URL die hier niet staat, wordt afgewezen.\nZo kunnen alleen vertrouwde applicatie-eindpunten in het systeem worden geregistreerd.\n\nElke URL moet:\n- Exact overeenkomen (inclusief protocol, domein en pad)\n- HTTPS gebruiken (behalve voor goedgekeurde ontwikkelomgevingen)\n\nℹ️ Opmerking: deze lijst wordt alleen gebruikt bij clientregistratie. De redirect-URL's van bestaande clients worden er niet automatisch door bepaald.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Invoer van redirect-URL
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Voer een toe te staan voorvoegsel voor redirect-URL's in
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Toevoegen van de redirect-URL bevestigen
oauth.administration.clientsSelfRegistrationDCR.allowAny=Elke URL toestaan
oauth.administration.clientsSelfRegistrationDCR.saved=Redirect-URL's succesvol opgeslagen
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Redirect-URL bestaat al
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=De toegestane redirect-URL verwijderen
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuratie met hoog risico</strong>.\n\nAls u de validatie van redirect-URI's uitschakelt, kan elke client autorisatieantwoorden ontvangen.\nDit kan leiden tot gecompromitteerde accounts en het uitlekken van tokens.\n\n👉 <strong>Aanbevolen</strong>: definieer in plaats daarvan expliciete voorvoegsels voor redirect-URI's.
oauth.administration.clientsSelfRegistrationCIMD.title=Toegestane {0}CIMD-URL's{1} voor clientregistratie
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD-URL's
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Wat is CIMD-clientregistratie?
oauth.administration.clientsSelfRegistrationCIMD.description=Bepaalt hoe nieuwe OAuth-clients kunnen worden geregistreerd via CIMD-links (Client Initiated Metadata).\nMet een CIMD-clientregistratieverzoek kan een nieuwe clientapplicatie dynamisch worden aangemaakt via een beveiligde, op OAuth gebaseerde link.\nElk registratieverzoek dat niet voldoet aan de vereiste parameters of het vereiste beleid, wordt afgewezen.\nZo kunnen alleen vertrouwde en correct geconfigureerde clientapplicaties in het systeem worden geregistreerd. Elk verzoek moet:\n\n- Alle vereiste clientmetadata bevatten (bijv. redirect-URL's, scopes)\nVoldoen aan de geconfigureerde beveiligings- en validatieregels\n- Afkomstig zijn van een vertrouwde of geautoriseerde bron\n\nℹ️ Opmerking: CIMD-registratie wordt alleen gebruikt bij het onboarden van clients. Bestaande clients worden na het aanmaken niet gewijzigd of bijgewerkt.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD-clientregistratie-URL's
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Voorvoegsel van CIMD-clientregistratie-URL
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Toevoegen van de CIMD-URL bevestigen
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Elke URL toestaan
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD-URL succesvol opgeslagen
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD-URL bestaat al
oauth.administration.clientsSelfRegistrationCIMD.delete=CIMD-URL verwijderen
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=De toegestane CIMD-URL verwijderen
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuratie met hoog risico</strong>.\n\nAls u elke CIMD-URL toestaat, kunnen clientmetadata vanaf niet-vertrouwde locaties worden geladen.\nDit kan leiden tot de registratie van kwaadaardige clients, vervalste metadata of onveilig OAuth-gedrag.\n\n👉 <strong>Aanbevolen</strong>: beperk de toegestane CIMD-URL-voorvoegsels tot vertrouwde domeinen.
oauth.administration.clientsAllowedCorsOrigins.title=Toegestane websites voor {0}browsertoegang{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS-origins
oauth.administration.clientsAllowedCorsOrigins.tooltip=Wat zijn CORS-origins?
oauth.administration.clientsAllowedCorsOrigins.description=Bepaalt welke websites browserverzoeken naar deze dienst mogen sturen.\nAlleen verzoeken van deze domeinen worden door de browser geaccepteerd. Zo worden uw API's beschermd tegen aanroepen door niet-vertrouwde webapplicaties.\nElke origin moet:\n- Alleen protocol + domein + poort bevatten (geen pad)\n- HTTPS gebruiken (behalve voor lokale ontwikkeling, indien ingeschakeld)\n\nℹ️ Opmerking: zo worden deze instellingen gebruikt\n\n- Toegestane redirect-URL's (hierboven) → bepaalt welke redirect-URL's zijn toegestaan bij clientregistratie\n- Toegestane CORS-origins → bepaalt welke websites API's vanuit een browser mogen aanroepen\n\nDeze instellingen staan los van de configuratie van elke client en gelden als globale beveiligingsregels.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Invoer van CORS-origin
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=CORS-origin toevoegen
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Toevoegen van de origin-URL bevestigen
oauth.administration.clientsAllowedCorsOrigins.allowAny=Elke origin toestaan
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=CORS-origin wordt automatisch toegestaan volgens de regel die alle redirect-URL's toestaat
oauth.administration.clientsAllowedCorsOrigins.delete=Origin-URL verwijderen
oauth.administration.clientsAllowedCorsOrigins.saved=Origin succesvol opgeslagen
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Origin bestaat al
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regel voor toegestane verzoekorigins, overgenomen van bestaande redirect-URL's
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=De toegestane origin verwijderen
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuratie met hoog risico</strong>.\n\nAls u elke CORS-origin toestaat, zijn browserverzoeken van willekeurige domeinen naar OAuth-eindpunten toegestaan. Daardoor kunnen niet-vertrouwde webapplicaties deelnemen aan OAuth-flows en neemt het risico op blootstelling of misbruik van tokens toe.\n\n👉 <strong>Aanbevolen</strong>: beperk de toegestane origins tot vertrouwde applicatiedomeinen.
