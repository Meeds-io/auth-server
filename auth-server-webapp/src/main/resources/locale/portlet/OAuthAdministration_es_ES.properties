oauth.administration.clientsSelfRegistrationDCR.title={0}URL de redirección DCR{1} para el registro de clientes
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL de redirección DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=¿Qué es una URL de redirección DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Define qué URL de redirección se permiten cuando un nuevo cliente se registra mediante DCR.\n\nSe rechazará cualquier solicitud de registro de cliente que contenga una URL de redirección que no figure aquí.\nEsto ayuda a garantizar que solo se puedan registrar en el sistema endpoints de aplicaciones de confianza.\n\nCada URL debe:\n- Coincidir exactamente (incluidos protocolo, dominio y ruta)\n- Usar HTTPS (excepto para entornos de desarrollo aprobados)\n\nℹ️ Nota: esta lista solo se usa durante el registro de clientes. No define automáticamente las URL de redirección de los clientes existentes.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Entrada de URL de redirección
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Introduzca un prefijo de URL de redirección que desee permitir
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirmar la adición de la URL de redirección
oauth.administration.clientsSelfRegistrationDCR.allowAny=Permitir cualquier URL
oauth.administration.clientsSelfRegistrationDCR.saved=URL de redirección guardadas correctamente
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=La URL de redirección ya existe
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Quitar la URL de redirección permitida
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nDesactivar la validación de las URI de redirección permite que cualquier cliente reciba respuestas de autorización.\nEsto puede provocar el compromiso de cuentas y la exfiltración de tokens.\n\n👉 <strong>Recomendado</strong>: defina en su lugar prefijos explícitos de URI de redirección.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URL CIMD{1} permitidas para el registro de clientes
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=¿Qué es el registro de clientes CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Define cómo se pueden registrar nuevos clientes OAuth mediante enlaces CIMD (Client Initiated Metadata).\nUna solicitud de registro de cliente CIMD permite crear dinámicamente una nueva aplicación cliente mediante un enlace seguro basado en OAuth.\nSe rechazará cualquier solicitud de registro que no cumpla los parámetros o las políticas requeridos.\nEsto ayuda a garantizar que solo se puedan registrar en el sistema aplicaciones cliente de confianza y correctamente configuradas. Cada solicitud debe:\n\n- Incluir todos los metadatos de cliente requeridos (p. ej., URL de redirección, ámbitos)\nCumplir las reglas de seguridad y validación configuradas\n- Proceder de una fuente de confianza o autorizada\n\nℹ️ Nota: el registro CIMD solo se usa durante la incorporación de clientes. No modifica ni actualiza los clientes existentes una vez creados.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL de registro de clientes CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefijo de URL de registro de clientes CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirmar la adición de la URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Permitir cualquier URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD guardada correctamente
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=La URL CIMD ya existe
oauth.administration.clientsSelfRegistrationCIMD.delete=Eliminar URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Quitar la URL CIMD permitida
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nPermitir cualquier URL CIMD significa que los metadatos de cliente se pueden cargar desde ubicaciones que no son de confianza.\nEsto puede provocar el registro de clientes maliciosos, la suplantación de metadatos o un comportamiento OAuth inseguro.\n\n👉 <strong>Recomendado</strong>: limita los prefijos de URL CIMD permitidos solo a dominios de confianza.
oauth.administration.clientsAllowedCorsOrigins.title=Sitios web permitidos para el {0}acceso desde el navegador{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Orígenes CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=¿Qué son los orígenes CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Defina qué sitios web pueden enviar solicitudes desde el navegador a este servicio.\nEl navegador solo aceptará las solicitudes procedentes de estos dominios. Esto protege sus API de llamadas de aplicaciones web que no son de confianza.\nCada origen debe:\n- Incluir solo protocolo + dominio + puerto (sin ruta)\n- Usar HTTPS (excepto para el desarrollo local, si está habilitado)\n\nℹ️ Nota: cómo se usan estos ajustes\n\n- URL de redirección permitidas (arriba) → filtra qué URL de redirección se permiten durante el registro de clientes\n- Orígenes CORS permitidos → controla qué sitios web pueden llamar a las API desde un navegador\n\nEstos ajustes son independientes de la configuración de cada cliente y actúan como reglas de seguridad globales.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Entrada de origen CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Añadir origen CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirmar la adición de la URL de origen
oauth.administration.clientsAllowedCorsOrigins.allowAny=Permitir cualquier origen
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=El origen CORS se permite automáticamente para ajustarse a la regla que permite todas las URL de redirección
oauth.administration.clientsAllowedCorsOrigins.delete=Eliminar URL de origen
oauth.administration.clientsAllowedCorsOrigins.saved=Origen guardado correctamente
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=El origen ya existe
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regla de origen de solicitudes permitidas heredada de las URL de redirección existentes
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Quitar el origen permitido
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nPermitir cualquier origen CORS autoriza solicitudes desde el navegador procedentes de dominios arbitrarios hacia los endpoints OAuth. Esto puede permitir que aplicaciones web que no son de confianza participen en flujos OAuth y aumenta el riesgo de exposición o uso indebido de tokens.\n\n👉 <strong>Recomendado</strong>: limita los orígenes permitidos solo a dominios de aplicaciones de confianza.
