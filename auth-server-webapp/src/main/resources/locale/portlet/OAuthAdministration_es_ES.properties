oauth.administration.clientsSelfRegistrationDCR.title={0}DCR Redirect URLs{1} for client registration
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR Redirect URLs
oauth.administration.clientsSelfRegistrationDCR.tooltip=What is a DCR Redirect URL?
oauth.administration.clientsSelfRegistrationDCR.description=Define qué URL de redirección se permiten cuando un nuevo cliente se registra mediante DCR.\n\nSe rechazará cualquier solicitud de registro de cliente que contenga una URL de redirección que no figure aquí.\nEsto ayuda a garantizar que solo se puedan registrar en el sistema endpoints de aplicaciones de confianza.\n\nCada URL debe:\n- Coincidir exactamente (incluidos protocolo, dominio y ruta)\n- Usar HTTPS (excepto para entornos de desarrollo aprobados)\n\nℹ️ Nota: esta lista solo se usa durante el registro de clientes. No define automáticamente las URL de redirección de los clientes existentes.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Redirect URL input
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Enter a redirect URL prefix to allow
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirm the addition of the redirect URL
oauth.administration.clientsSelfRegistrationDCR.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationDCR.saved=Redirect URLs saved successfully
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Redirect URL already exists
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Remove the allowed redirect URL
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nDesactivar la validación de las URI de redirección permite que cualquier cliente reciba respuestas de autorización.\nEsto puede provocar el compromiso de cuentas y la exfiltración de tokens.\n\n👉 <strong>Recomendado</strong>: define en su lugar prefijos explícitos de URI de redirección.
oauth.administration.clientsSelfRegistrationCIMD.title=Allowed {0}CIMD URLs{1} for client registration
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URLs
oauth.administration.clientsSelfRegistrationCIMD.tooltip=What is CIMD Client Registration?
oauth.administration.clientsSelfRegistrationCIMD.description=Define cómo se pueden registrar nuevos clientes OAuth mediante enlaces CIMD (Client Initiated Metadata).\nUna solicitud de registro de cliente CIMD permite crear dinámicamente una nueva aplicación cliente mediante un enlace seguro basado en OAuth.\nSe rechazará cualquier solicitud de registro que no cumpla los parámetros o las políticas requeridos.\nEsto ayuda a garantizar que solo se puedan registrar en el sistema aplicaciones cliente de confianza y correctamente configuradas. Cada solicitud debe:\n\n- Incluir todos los metadatos de cliente requeridos (p. ej., URL de redirección, ámbitos)\nCumplir las reglas de seguridad y validación configuradas\n- Proceder de una fuente de confianza o autorizada\n\nℹ️ Nota: el registro CIMD solo se usa durante la incorporación de clientes. No modifica ni actualiza los clientes existentes una vez creados.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD Client Registration URLs
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD Client Registration URL prefix
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirm the addition of the CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL saved successfully
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL already exists
oauth.administration.clientsSelfRegistrationCIMD.delete=Delete CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Remove the allowed CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nPermitir cualquier URL CIMD significa que los metadatos de cliente se pueden cargar desde ubicaciones que no son de confianza.\nEsto puede provocar el registro de clientes maliciosos, la suplantación de metadatos o un comportamiento OAuth inseguro.\n\n👉 <strong>Recomendado</strong>: limita los prefijos de URL CIMD permitidos solo a dominios de confianza.
oauth.administration.clientsAllowedCorsOrigins.title=Allowed websites for {0}browser access{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Cors Origins
oauth.administration.clientsAllowedCorsOrigins.tooltip=What are cors origins?
oauth.administration.clientsAllowedCorsOrigins.description=Defina qué sitios web pueden enviar solicitudes desde el navegador a este servicio.\nEl navegador solo aceptará las solicitudes procedentes de estos dominios. Esto protege sus API de llamadas de aplicaciones web que no son de confianza.\nCada origen debe:\n- Incluir solo protocolo + dominio + puerto (sin ruta)\n- Usar HTTPS (excepto para el desarrollo local, si está habilitado)\n\nℹ️ Nota: cómo se usan estos ajustes\n\n- URL de redirección permitidas (arriba) → filtra qué URL de redirección se permiten durante el registro de clientes\n- Orígenes CORS permitidos → controla qué sitios web pueden llamar a las API desde un navegador\n\nEstos ajustes son independientes de la configuración de cada cliente y actúan como reglas de seguridad globales.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Cors origin input
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Add Cors Origin
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirm the addition of the Origin URL
oauth.administration.clientsAllowedCorsOrigins.allowAny=Allow any origin
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Cors Origin is automatically allowed to fit the rule of allowing all redirect URLs
oauth.administration.clientsAllowedCorsOrigins.delete=Delete Origin URL
oauth.administration.clientsAllowedCorsOrigins.saved=Origin saved successfully
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Origin already exists
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Allowed requests origin rule inherited from existing Redirect URLs
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Remove the allowed Origin
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuración de alto riesgo</strong>.\n\nPermitir cualquier origen CORS autoriza solicitudes desde el navegador procedentes de dominios arbitrarios hacia los endpoints OAuth. Esto puede permitir que aplicaciones web que no son de confianza participen en flujos OAuth y aumenta el riesgo de exposición o uso indebido de tokens.\n\n👉 <strong>Recomendado</strong>: limita los orígenes permitidos solo a dominios de aplicaciones de confianza.
