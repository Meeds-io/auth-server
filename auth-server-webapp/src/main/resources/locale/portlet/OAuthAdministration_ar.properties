oauth.administration.clientsSelfRegistrationDCR.saved=تم حفظ روابط إعادة التوجيه بنجاح
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=رابط إعادة التوجيه موجود بالفعل
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=إزالة رابط إعادة التوجيه المسموح به
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>إعداد عالي الخطورة</strong>.\n\nيسمح تعطيل التحقق من URI إعادة التوجيه لأي عميل بتلقي استجابات التفويض.\nقد يؤدي ذلك إلى اختراق الحسابات وتسريب الرموز.\n\n👉 <strong>يُوصى</strong>: بتحديد بادئات صريحة لـ URI إعادة التوجيه بدلًا من ذلك.
oauth.administration.clientsSelfRegistrationCIMD.title={0}عناوين URL الخاصة بـ CIMD{1} المسموح بها لتسجيل العملاء
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=روابط CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=ما هو تسجيل عميل CIMD؟
oauth.administration.clientsSelfRegistrationCIMD.description=يحدد كيفية تسجيل عملاء OAuth الجدد باستخدام روابط CIMD (Client Initiated Metadata).\nيتيح طلب تسجيل عميل عبر CIMD إنشاء تطبيق عميل جديد ديناميكيًا باستخدام رابط آمن قائم على OAuth.\nسيتم رفض أي طلب تسجيل لا يستوفي المعايير أو السياسات المطلوبة.\nيساعد ذلك على ضمان ألا يتم تسجيل في النظام سوى تطبيقات العملاء الموثوقة والمهيأة بشكل صحيح. يجب أن يستوفي كل طلب ما يلي:\n\n- أن يتضمن جميع البيانات الوصفية المطلوبة للعميل (مثل عناوين URL لإعادة التوجيه والنطاقات)\nأن يمتثل لقواعد الأمان والتحقق المهيأة\n- أن يصدر عن مصدر موثوق أو مصرّح له\n\nℹ️ ملاحظة: لا يُستخدم التسجيل عبر CIMD إلا أثناء إعداد العميل لأول مرة. ولا يعدّل العملاء الحاليين أو يحدّثهم بعد إنشائهم.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=روابط تسجيل عميل CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=بادئة رابط تسجيل عميل CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=تأكيد إضافة رابط CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=السماح بأي عنوان URL
oauth.administration.clientsSelfRegistrationCIMD.saved=تم حفظ رابط CIMD بنجاح
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=رابط CIMD موجود بالفعل
oauth.administration.clientsSelfRegistrationCIMD.delete=حذف رابط CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=إزالة رابط CIMD المسموح به
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>إعداد عالي الخطورة</strong>.\n\nيعني السماح بأي رابط CIMD إمكانية تحميل البيانات الوصفية للعملاء من مواقع غير موثوقة.\nقد يؤدي ذلك إلى تسجيل عملاء ضارين أو انتحال البيانات الوصفية أو سلوك OAuth غير آمن.\n\n👉 <strong>يُوصى</strong>: بقصر بادئات روابط CIMD المسموح بها على النطاقات الموثوقة فقط.
oauth.administration.clientsAllowedCorsOrigins.title=المواقع المسموح لها {0}بالوصول عبر المتصفح{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=أصول CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=ما هي أصول CORS؟
oauth.administration.clientsAllowedCorsOrigins.description=يحدد مواقع الويب المسموح لها بإرسال طلبات من المتصفح إلى هذه الخدمة.\nلن يقبل المتصفح إلا الطلبات الواردة من هذه النطاقات. يحمي ذلك واجهات API الخاصة بك من الاستدعاء من قبل تطبيقات ويب غير موثوقة.\nيجب أن يستوفي كل مصدر ما يلي:\n- أن يتضمن البروتوكول + النطاق + المنفذ فقط (بدون مسار)\n- أن يستخدم HTTPS (باستثناء التطوير المحلي إذا كان مفعّلًا)\n\nℹ️ ملاحظة: كيفية استخدام هذه الإعدادات\n\n- عناوين URL لإعادة التوجيه المسموح بها (أعلاه) ← تحدد عناوين URL لإعادة التوجيه المسموح بها أثناء تسجيل العملاء\n- مصادر CORS المسموح بها ← تتحكم في مواقع الويب التي يمكنها استدعاء واجهات API من المتصفح\n\nهذه الإعدادات مستقلة عن تهيئة كل عميل، وتعمل كقواعد أمان عامة.
