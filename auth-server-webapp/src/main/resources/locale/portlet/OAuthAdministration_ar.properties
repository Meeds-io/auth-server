oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>إعداد عالي الخطورة</strong>.\n\nيتيح السماح بأي أصل CORS إرسال طلبات من المتصفح من نطاقات عشوائية إلى نقاط نهاية OAuth. قد يمكّن ذلك تطبيقات ويب غير موثوقة من المشاركة في تدفقات OAuth ويزيد خطر كشف الرموز أو إساءة استخدامها.\n\n👉 <strong>يُوصى</strong>: بقصر الأصول المسموح بها على نطاقات التطبيقات الموثوقة فقط.
