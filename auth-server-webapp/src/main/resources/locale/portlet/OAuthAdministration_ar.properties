oauth.administration.clientsSelfRegistrationDCR.title={0}روابط إعادة التوجيه لـ DCR{1} لتسجيل العملاء
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=روابط إعادة التوجيه لـ DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=ما هو رابط إعادة توجيه DCR؟
oauth.administration.clientsSelfRegistrationDCR.description=يحدد روابط إعادة التوجيه المسموح بها عندما يُسجَّل عميل جديد باستخدام DCR.\n\nسيُرفض أي طلب تسجيل عميل يتضمن رابط إعادة توجيه غير مدرج هنا.\nيساعد ذلك على ضمان ألا تُسجَّل في النظام إلا نقاط نهاية التطبيقات الموثوقة.\n\nيجب أن يكون كل عنوان URL:\n- مطابقًا تمامًا (بما في ذلك البروتوكول والنطاق والمسار)\n- مستخدمًا لـ HTTPS (باستثناء بيئات التطوير المعتمدة)\n\nℹ️ ملاحظة: تُستخدم هذه القائمة أثناء تسجيل العملاء فقط. ولا تحدد تلقائيًا روابط إعادة التوجيه للعملاء الحاليين.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=حقل إدخال رابط إعادة التوجيه
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=أدخل بادئة رابط إعادة التوجيه المراد السماح بها
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=تأكيد إضافة رابط إعادة التوجيه
