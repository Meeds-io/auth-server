oauth.administration.clientsSelfRegistrationDCR.title={0}Adresy URL przekierowania DCR{1} do rejestracji klientów
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=Adresy URL przekierowania DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Czym jest adres URL przekierowania DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Określa, które adresy URL przekierowania są dozwolone, gdy nowy klient rejestruje się za pomocą DCR.\n\nKażde żądanie rejestracji klienta zawierające adres URL przekierowania, którego nie ma na tej liście, zostanie odrzucone.\nDzięki temu w systemie można zarejestrować tylko zaufane punkty końcowe aplikacji.\n\nKażdy adres URL musi:\n- być dokładnie zgodny (łącznie z protokołem, domeną i ścieżką)\n- używać HTTPS (z wyjątkiem zatwierdzonych środowisk programistycznych)\n\nℹ️ Uwaga: ta lista jest używana tylko podczas rejestracji klienta. Nie określa automatycznie adresów URL przekierowania istniejących klientów.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Pole adresu URL przekierowania
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Wprowadź prefiks adresu URL przekierowania, który ma być dozwolony
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Potwierdź dodanie adresu URL przekierowania
oauth.administration.clientsSelfRegistrationDCR.allowAny=Zezwalaj na dowolny adres URL
oauth.administration.clientsSelfRegistrationDCR.saved=Adresy URL przekierowania zostały zapisane
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Adres URL przekierowania już istnieje
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Usuń dozwolony adres URL przekierowania
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Konfiguracja wysokiego ryzyka</strong>.\n\nWyłączenie weryfikacji URI przekierowania pozwala dowolnemu klientowi otrzymywać odpowiedzi autoryzacyjne.\nMoże to doprowadzić do przejęcia konta i wycieku tokenów.\n\n👉 <strong>Zalecane</strong>: zamiast tego należy zdefiniować jawne prefiksy URI przekierowania.
oauth.administration.clientsSelfRegistrationCIMD.title=Dozwolone {0}adresy URL CIMD{1} do rejestracji klientów
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=Adresy URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Czym jest rejestracja klientów CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Określa, w jaki sposób nowi klienci OAuth mogą być rejestrowani za pomocą linków CIMD (Client Initiated Metadata).\nŻądanie rejestracji klienta CIMD umożliwia dynamiczne utworzenie nowej aplikacji klienckiej przy użyciu bezpiecznego linku opartego na OAuth.\nKażde żądanie rejestracji, które nie spełnia wymaganych parametrów lub zasad, zostanie odrzucone.\nDzięki temu w systemie można zarejestrować tylko zaufane i poprawnie skonfigurowane aplikacje klienckie. Każde żądanie musi:\n\n- zawierać wszystkie wymagane metadane klienta (np. adresy URL przekierowania, zakresy)\nbyć zgodne ze skonfigurowanymi regułami bezpieczeństwa i walidacji\n- pochodzić z zaufanego lub autoryzowanego źródła\n\nℹ️ Uwaga: rejestracja CIMD jest używana tylko podczas wdrażania klienta. Nie modyfikuje ani nie aktualizuje istniejących klientów po ich utworzeniu.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=Adresy URL rejestracji klientów CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefiks adresu URL rejestracji klientów CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Potwierdź dodanie adresu URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Zezwalaj na dowolny adres URL
oauth.administration.clientsSelfRegistrationCIMD.saved=Adres URL CIMD został zapisany
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=Adres URL CIMD już istnieje
oauth.administration.clientsSelfRegistrationCIMD.delete=Usuń adres URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Usuń dozwolony adres URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Konfiguracja wysokiego ryzyka</strong>.\n\nZezwolenie na dowolny adres URL CIMD oznacza, że metadane klienta mogą być ładowane z niezaufanych lokalizacji.\nMoże to skutkować rejestracją złośliwych klientów, podszywaniem się pod metadane lub niebezpiecznym działaniem OAuth.\n\n👉 <strong>Zalecane</strong>: należy ograniczyć dozwolone prefiksy adresów URL CIMD tylko do zaufanych domen.
oauth.administration.clientsAllowedCorsOrigins.title=Dozwolone witryny dla {0}dostępu z przeglądarki{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Źródła CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Czym są źródła CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Określa, które witryny mogą wysyłać żądania z przeglądarki do tej usługi.\nPrzeglądarka zaakceptuje tylko żądania pochodzące z tych domen. Chroni to interfejsy API przed wywołaniami z niezaufanych aplikacji internetowych.\nKażde źródło musi:\n- zawierać tylko protokół + domenę + port (bez ścieżki)\n- używać HTTPS (z wyjątkiem lokalnego środowiska programistycznego, jeśli jest włączone)\n\nℹ️ Uwaga: jak są używane te ustawienia\n\n- Dozwolone adresy URL przekierowania (powyżej) → określają, które adresy URL przekierowania są dozwolone podczas rejestracji klienta\n- Dozwolone źródła CORS → określają, które witryny mogą wywoływać interfejsy API z przeglądarki\n\nTe ustawienia są niezależne od konfiguracji poszczególnych klientów i działają jako globalne reguły bezpieczeństwa.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Pole źródła CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Dodaj źródło CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Potwierdź dodanie adresu URL źródła
oauth.administration.clientsAllowedCorsOrigins.allowAny=Zezwalaj na dowolne źródło
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Źródło CORS jest automatycznie dozwolone zgodnie z regułą zezwalającą na wszystkie adresy URL przekierowania
oauth.administration.clientsAllowedCorsOrigins.delete=Usuń adres URL źródła
oauth.administration.clientsAllowedCorsOrigins.saved=Źródło zostało zapisane
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Źródło już istnieje
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Reguła dozwolonego źródła żądań odziedziczona z istniejących adresów URL przekierowania
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Usuń dozwolone źródło
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Konfiguracja wysokiego ryzyka</strong>.\n\nZezwolenie na każde źródło CORS pozwala na żądania przeglądarki z dowolnych domen do punktów końcowych OAuth. Może to umożliwić niezaufanym aplikacjom internetowym uczestniczenie w przepływach OAuth i zwiększyć ryzyko narażenia lub niewłaściwego użycia tokenów.\n\n👉 <strong>Zalecane</strong>: Ogranicz dozwolone źródła tylko do zaufanych domen aplikacji.
