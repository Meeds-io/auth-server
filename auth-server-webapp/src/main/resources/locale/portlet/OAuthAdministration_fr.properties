oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.title=URL de redirection {0}autorisées{1} pour l'enregistrement du client
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.tooltip=Qu'est-ce qu'une URL de redirection ?
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.description=Définit les URL de redirection autorisées lors de l'enregistrement d'un nouveau client.\nToute demande d'enregistrement de client contenant une URL de redirection ne figurant pas dans cette liste sera rejetée.\nCela permet de garantir que seuls les points de terminaison d'applications de confiance peuvent être enregistrés dans le système. Chaque URL doit :\n- Correspondre exactement (y compris le protocole, le domaine et le chemin d'accès)\n- Utiliser le protocole HTTPS (sauf pour les environnements de développement approuvés)\n\nℹ️ Remarque : cette liste est utilisée uniquement lors de l'enregistrement des clients. Elle ne définit pas automatiquement les URL de redirection des clients existants.
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.inputTitle=Champs des URL de redirection
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.inputPlaceholder=Entrez un préfixe d'URL de redirection pour autoriser
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny=Autoriser n'importe quelle URL
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.whitelist=Liste blanche des URL de redirection
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny.enabled=Les URL de redirection sont autorisées à n'importe quel client OAuth. Les nouveaux clients seront masqués par défaut aux utilisateurs finaux
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny.disabled=Les URL de redirection sont limitées à celles en liste blanche. Les clients nouvellement enregistrés seront masqués par défaut aux utilisateurs finaux
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.added=URL de redirection ajoutée avec succès
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.removed=URL de redirection supprimée avec succès
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.alreadyExists=L'URL de redirection existe déjà
