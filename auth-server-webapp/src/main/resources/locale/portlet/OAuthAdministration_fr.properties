oauth.administration.clientsAllowedCorsOrigins.allowAny.disabled=Les Cors sont limitées aux origines en liste blanche.
oauth.administration.clientsAllowedCorsOrigins.input.disabled=Cors Origin est automatiquement autorisé à s'adapter à la règle d'autorisation de toutes les URL de redirection sont autorisées
