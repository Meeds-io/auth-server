oauth.administration.oAuthClients=Clients OAuth
oauth.administration.clientsSelfRegistrationDCR.title={0}URL de redirection DCR{1} pour l'enregistrement du client
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL de redirection DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Qu'est-ce qu'une URL de redirection DCR ?
oauth.administration.clientsSelfRegistrationDCR.description=Définit les URL de redirection autorisées lors de l'enregistrement d'un nouveau client.\nToute demande d'enregistrement de client contenant une URL de redirection ne figurant pas dans cette liste sera rejetée.\nCela permet de garantir que seuls les points de terminaison d'applications de confiance peuvent être enregistrés dans le système. Chaque URL doit :\n- Correspondre exactement (y compris le protocole, le domaine et le chemin d'accès)\n- Utiliser le protocole HTTPS (sauf pour les environnements de développement approuvés)\n\nℹ️ Remarque : cette liste est utilisée uniquement lors de l'enregistrement des clients. Elle ne définit pas automatiquement les URL de redirection des clients existants.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Redirect URL input
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Entrez un préfixe d'URL de redirection pour autoriser
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirmer l'ajout de l'URL de redirection
oauth.administration.clientsSelfRegistrationDCR.allowAny=Autoriser n'importe quelle URL
oauth.administration.clientsSelfRegistrationDCR.saved=URL de redirection enregistrée avec succès
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=L'URL de redirection existe déjà
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Supprimer l'URL de redirection autorisée
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuration de risque élevé</strong>.\n\nLa désactivation de la validation URI de redirection permet à n'importe quel client de recevoir des réponses d'autorisation.\nCeci peut entraîner une compromission du compte et une exfiltration de jetons.\n\n👉 <strong>Recommandé</strong>: Définir des préfixes URI redirigés explicites à la place.
oauth.administration.clientsSelfRegistrationCIMD.title={0}CIMD URLs{1} for client registration
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL du CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=What is CIMD URL?
oauth.administration.clientsSelfRegistrationCIMD.description=Définit la manière dont les nouveaux clients OAuth peuvent être enregistrés à l'aide de liens CIMD (Client Initiated Metadata).\nUne demande d'enregistrement de client CIMD permet de créer dynamiquement une nouvelle application cliente à l'aide d'un lien sécurisé basé sur OAuth.\nToute demande d'enregistrement qui ne respecte pas les paramètres ou les politiques requis sera rejetée.\nCela permet de garantir que seules les applications clientes fiables et correctement configurées peuvent être enregistrées dans le système. Chaque demande doit :\n\n- Inclure toutes les métadonnées client requises (par exemple, URL de redirection, champs d'application)\nRespecter les règles de sécurité et de validation configurées\n- Provenir d'une source fiable ou autorisée\n\nℹ️ Remarque : l'enregistrement CIMD est utilisé uniquement lors de l'intégration des clients. Il ne modifie ni ne met à jour les clients existants après leur création.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL d'enregistrement du client CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Préfixe d'URL d'enregistrement du client CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirmer l'ajout de l'URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Autoriser n'importe quelle URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD enregistrée avec succès
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=L'URL CIMD existe déjà
oauth.administration.clientsSelfRegistrationCIMD.delete=Supprimer l'URL du CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Supprimer l'URL CIMD autorisée
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuration à haut risque</strong>.\n\nAutoriser n'importe quelle URL CIMD signifie que les métadonnées des clients peuvent être chargées à partir d'emplacements non fiables.\nCela peut entraîner l'enregistrement de clients malveillants, l'usurpation de métadonnées ou un comportement OAuth non sécurisé.\n\n👉 <strong>Recommandé</strong> : Limitez les préfixes d'URL CIMD autorisés aux domaines de confiance uniquement.
oauth.administration.clientsAllowedCorsOrigins.title=Sites Web autorisés pour {0}l'accès au navigateur{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Cors Origins
oauth.administration.clientsAllowedCorsOrigins.tooltip=Qu'est-ce que "Cors Origins" ?
oauth.administration.clientsAllowedCorsOrigins.description=Définit quels sites sont autorisés à faire des requêtes basées sur le navigateur à ce service.\nSeules les requêtes provenant de ces domaines seront acceptées par le navigateur. Cela protège vos API d'être appelées par des applications web non fiables.\nChaque origine doit être :\n- Inclure seulement protocole + domaine + port (sans chemin)\n- Utiliser HTTPS (sauf pour le développement local si activé)\n\nNote : Comment ces paramètres sont utilisés\n\n- URL de redirection autorisées (ci-dessus) → filtres qui redirigent les URL sont autorisées lors de l'enregistrement du client\n- Origines CORS autorisées → contrôle quels sites Web peuvent appeler les API depuis un navigateur\n\nCes paramètres sont indépendants de la configuration de chaque client et agissent comme règles de sécurité globales.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Cors origin input
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Ajouter un "Cors Origin"
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirmez l'ajout de l'URL Origin
oauth.administration.clientsAllowedCorsOrigins.allowAny=Autoriser n'importe quelle origine
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Cors Origin est automatiquement autorisé à respecter la règle d'autorisation de toutes les URL de redirection
oauth.administration.clientsAllowedCorsOrigins.delete=Supprimer l'URL d'origine
oauth.administration.clientsAllowedCorsOrigins.saved=Origine enregistrée avec succès
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=L'origine existe déjà
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Règle d'origine des requêtes autorisées héritée des URL de redirection existantes
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Retirer l'origine autorisée
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuration de risque élevé</strong>.\n\nAutoriser n'importe quelle origine CORS permet des requêtes basées sur le navigateur depuis des domaines arbitraires vers des terminaux OAuth. Cela peut permettre à des applications Web non fiables de participer aux flux OAuth et augmenter le risque d'exposition de jetons ou d'utilisation abusive.\n\n👉 <strong>Recommandé</strong>: Restreindre les origines autorisées aux seuls domaines d'application de confiance.
