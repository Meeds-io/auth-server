oauth.administration.clientsSelfRegistrationDCR.title={0}URLs de redirecionamento DCR{1} para o registro de clientes
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URLs de redirecionamento DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=O que é uma URL de redirecionamento DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Define quais URLs de redirecionamento são permitidas quando um novo cliente se registra usando DCR.\n\nQualquer solicitação de registro de cliente que contenha uma URL de redirecionamento não listada aqui será rejeitada.\nIsso ajuda a garantir que apenas endpoints de aplicativos confiáveis possam ser registrados no sistema.\n\nCada URL deve:\n- Corresponder exatamente (incluindo protocolo, domínio e caminho)\n- Usar HTTPS (exceto em ambientes de desenvolvimento aprovados)\n\nℹ️ Observação: esta lista é usada apenas durante o registro de clientes. Ela não define automaticamente as URLs de redirecionamento dos clientes existentes.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Campo de URL de redirecionamento
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Insira um prefixo de URL de redirecionamento a ser permitido
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirmar a adição da URL de redirecionamento
oauth.administration.clientsSelfRegistrationDCR.allowAny=Permitir qualquer URL
oauth.administration.clientsSelfRegistrationDCR.saved=URLs de redirecionamento salvas com sucesso
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=A URL de redirecionamento já existe
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Remover a URL de redirecionamento permitida
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nDesativar a validação de URI de redirecionamento permite que qualquer cliente receba respostas de autorização.\nIsso pode resultar no comprometimento de contas e no vazamento de tokens.\n\n👉 <strong>Recomendado</strong>: defina prefixos explícitos de URI de redirecionamento.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URLs CIMD{1} permitidas para o registro de clientes
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URLs CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=O que é o registro de clientes CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Define como novos clientes OAuth podem ser registrados usando links CIMD (Client Initiated Metadata).\nUma solicitação de registro de cliente CIMD permite criar dinamicamente um novo aplicativo cliente usando um link seguro baseado em OAuth.\nQualquer solicitação de registro que não atenda aos parâmetros ou às políticas exigidos será rejeitada.\nIsso ajuda a garantir que apenas aplicativos cliente confiáveis e configurados corretamente possam ser registrados no sistema. Cada solicitação deve:\n\n- Incluir todos os metadados obrigatórios do cliente (por exemplo, URLs de redirecionamento, escopos)\nCumprir as regras de segurança e validação configuradas\n- Originar-se de uma fonte confiável ou autorizada\n\nℹ️ Observação: o registro CIMD é usado apenas durante a integração do cliente. Ele não modifica nem atualiza clientes existentes depois de criados.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URLs de registro do cliente CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefixo da URL de registro do cliente CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirmar a adição da URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Permitir qualquer URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD salva com sucesso
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=A URL CIMD já existe
oauth.administration.clientsSelfRegistrationCIMD.delete=Excluir URL do CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Remover a URL CIMD permitida
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nPermitir qualquer URL CIMD significa que os metadados do cliente podem ser carregados de locais não confiáveis.\nIsso pode resultar no registro de clientes maliciosos, na falsificação de metadados ou em um comportamento OAuth inseguro.\n\n👉 <strong>Recomendado</strong>: restrinja os prefixos de URL CIMD permitidos apenas a domínios confiáveis.
oauth.administration.clientsAllowedCorsOrigins.title=Sites permitidos para {0}acesso pelo navegador{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Origens CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=O que são origens CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Define quais sites podem fazer requisições a este serviço a partir do navegador.\nSomente as requisições vindas desses domínios serão aceitas pelo navegador. Isso protege suas APIs contra chamadas de aplicações web não confiáveis.\nCada origem deve:\n- Incluir apenas protocolo + domínio + porta (sem caminho)\n- Usar HTTPS (exceto para desenvolvimento local, se habilitado)\n\nℹ️ Observação: como essas configurações são usadas\n\n- URLs de redirecionamento permitidas (acima) → filtra quais URLs de redirecionamento são permitidas durante o registro de clientes\n- Origens CORS permitidas → controla quais sites podem chamar as APIs a partir de um navegador\n\nEssas configurações são independentes da configuração de cada cliente e funcionam como regras globais de segurança.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Campo de origem CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Adicionar origem CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirmar a adição da URL de origem
oauth.administration.clientsAllowedCorsOrigins.allowAny=Permitir qualquer origem
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=A origem CORS é permitida automaticamente para se adequar à regra que permite todas as URLs de redirecionamento
oauth.administration.clientsAllowedCorsOrigins.delete=Excluir URL de origem
oauth.administration.clientsAllowedCorsOrigins.saved=Origem salva com sucesso
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=A origem já existe
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regra de origem das solicitações permitidas herdada das URLs de redirecionamento existentes
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Remover a origem permitida
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nPermitir qualquer origem CORS autoriza solicitações feitas pelo navegador a partir de domínios arbitrários para os endpoints OAuth. Isso pode permitir que aplicativos web não confiáveis participem de fluxos OAuth e aumenta o risco de exposição ou uso indevido de tokens.\n\n👉 <strong>Recomendado</strong>: restrinja as origens permitidas apenas a domínios de aplicativos confiáveis.
