oauth.administration.clientsSelfRegistrationDCR.title=クライアント登録用の {0}DCR リダイレクト URL{1}
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR リダイレクト URL
oauth.administration.clientsSelfRegistrationDCR.tooltip=DCR リダイレクト URL とは？
oauth.administration.clientsSelfRegistrationDCR.description=新しいクライアントが DCR を使用して登録する際に許可されるリダイレクト URL を定義します。\n\nここに記載されていないリダイレクト URL を含むクライアント登録リクエストは拒否されます。\nこれにより、信頼できるアプリケーションのエンドポイントのみをシステムに登録できるようになります。\n\n各 URL は次の条件を満たす必要があります:\n- 完全に一致する（プロトコル、ドメイン、パスを含む）\n- HTTPS を使用する（承認された開発環境を除く）\n\nℹ️ 注: このリストはクライアント登録時にのみ使用されます。既存のクライアントのリダイレクト URL を自動的に定義することはありません。
oauth.administration.clientsSelfRegistrationDCR.inputTitle=リダイレクト URL の入力
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=許可するリダイレクト URL のプレフィックスを入力してください
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=リダイレクト URL の追加を確定
oauth.administration.clientsSelfRegistrationDCR.allowAny=任意の URL を許可する
oauth.administration.clientsSelfRegistrationDCR.saved=リダイレクト URL を保存しました
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=リダイレクト URL は既に存在します
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=許可済みのリダイレクト URL を削除
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>高リスクの構成</strong>。\n\nリダイレクト URI の検証を無効にすると、任意のクライアントが認可レスポンスを受け取れるようになります。\nその結果、アカウントの侵害やトークンの流出が発生するおそれがあります。\n\n👉 <strong>推奨</strong>: 代わりに、明示的なリダイレクト URI のプレフィックスを定義してください。
oauth.administration.clientsSelfRegistrationCIMD.title=クライアント登録で許可する {0}CIMD URL{1}
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.tooltip=CIMD クライアント登録とは？
oauth.administration.clientsSelfRegistrationCIMD.description=CIMD（Client Initiated Metadata）リンクを使用して新しい OAuth クライアントを登録する方法を定義します。\nCIMD クライアント登録リクエストにより、安全な OAuth ベースのリンクを使用して新しいクライアントアプリケーションを動的に作成できます。\n必要なパラメーターやポリシーを満たさない登録リクエストは拒否されます。\nこれにより、信頼できる適切に構成されたクライアントアプリケーションのみをシステムに登録できるようになります。各リクエストは次の条件を満たす必要があります:\n\n- 必要なクライアントメタデータ（リダイレクト URL、スコープなど）をすべて含める\n- 構成されたセキュリティおよび検証ルールに準拠する\n- 信頼できる、または承認された送信元から送られる\n\nℹ️ 注: CIMD 登録はクライアントのオンボーディング時にのみ使用されます。作成済みのクライアントを変更または更新することはありません。
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD クライアント登録 URL
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD クライアント登録 URL のプレフィックス
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=CIMD URL の追加を確定
oauth.administration.clientsSelfRegistrationCIMD.allowAny=任意の URL を許可する
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL を保存しました
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL は既に存在します
oauth.administration.clientsSelfRegistrationCIMD.delete=CIMD URL を削除
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=許可済みの CIMD URL を削除
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>高リスクの構成</strong>。\n\n任意の CIMD URL を許可すると、信頼できない場所からクライアントメタデータが読み込まれる可能性があります。\nその結果、悪意のあるクライアントの登録、メタデータのなりすまし、安全でない OAuth の動作が発生するおそれがあります。\n\n👉 <strong>推奨</strong>: 許可する CIMD URL のプレフィックスを信頼できるドメインのみに制限してください。
oauth.administration.clientsAllowedCorsOrigins.title={0}ブラウザーからのアクセス{1}を許可する Web サイト
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS オリジン
oauth.administration.clientsAllowedCorsOrigins.tooltip=CORS オリジンとは？
oauth.administration.clientsAllowedCorsOrigins.description=このサービスへのブラウザーベースのリクエストを許可する Web サイトを定義します。\nこれらのドメインからのリクエストのみがブラウザーで受け付けられます。これにより、信頼できない Web アプリケーションから API が呼び出されるのを防ぎます。\n各オリジンは次の条件を満たす必要があります:\n- プロトコル + ドメイン + ポートのみを含める（パスは含めない）\n- HTTPS を使用する（有効にした場合のローカル開発を除く）\n\nℹ️ 注: これらの設定の使われ方\n\n- 許可されたリダイレクト URL（上記） → クライアント登録時に許可されるリダイレクト URL を絞り込みます\n- 許可された CORS オリジン → ブラウザーから API を呼び出せる Web サイトを制御します\n\nこれらの設定は各クライアントの構成とは独立しており、グローバルなセキュリティルールとして機能します。
oauth.administration.clientsAllowedCorsOrigins.inputTitle=CORS オリジンの入力
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=CORS オリジンを追加
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=オリジン URL の追加を確定
oauth.administration.clientsAllowedCorsOrigins.allowAny=任意のオリジンを許可
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=すべてのリダイレクト URL を許可するルールに合わせて、CORS オリジンは自動的に許可されます
oauth.administration.clientsAllowedCorsOrigins.delete=オリジン URL を削除
oauth.administration.clientsAllowedCorsOrigins.saved=オリジンを保存しました
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=オリジンは既に存在します
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=既存のリダイレクト URL から継承された、許可済みリクエストオリジンのルール
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=許可済みのオリジンを削除
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>高リスクの構成</strong>。\n\n任意の CORS オリジンを許可すると、任意のドメインから OAuth エンドポイントへのブラウザーベースのリクエストが可能になります。信頼できない Web アプリケーションが OAuth フローに参加できるようになり、トークンの漏えいや悪用のリスクが高まるおそれがあります。\n\n👉 <strong>推奨</strong>: 許可するオリジンを信頼できるアプリケーションのドメインのみに制限してください。
