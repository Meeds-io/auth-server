oauth.administration.clientsSelfRegistrationDCR.title={0}URL-uri de redirecționare DCR{1} pentru înregistrarea clienților
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL-uri de redirecționare DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Ce este un URL de redirecționare DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Definește ce URL-uri de redirecționare sunt permise atunci când un client nou se înregistrează prin DCR.\n\nOrice cerere de înregistrare a unui client care conține un URL de redirecționare nelistat aici va fi respinsă.\nAstfel, numai punctele finale de încredere ale aplicațiilor pot fi înregistrate în sistem.\n\nFiecare URL trebuie:\n- Să corespundă exact (inclusiv protocolul, domeniul și calea)\n- Să folosească HTTPS (cu excepția mediilor de dezvoltare aprobate)\n\nℹ️ Notă: această listă este folosită numai la înregistrarea clienților. Nu definește automat URL-urile de redirecționare ale clienților existenți.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Câmp pentru URL-ul de redirecționare
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Introduceți un prefix de URL de redirecționare pe care doriți să îl permiteți
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirmați adăugarea URL-ului de redirecționare
oauth.administration.clientsSelfRegistrationDCR.allowAny=Permiteți orice URL
oauth.administration.clientsSelfRegistrationDCR.saved=URL-uri de redirecționare salvate cu succes
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=URL-ul de redirecționare există deja
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Eliminați URL-ul de redirecționare permis
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configurație cu risc ridicat</strong>.\n\nDezactivarea validării URI-urilor de redirecționare permite oricărui client să primească răspunsuri de autorizare.\nAcest lucru poate duce la compromiterea conturilor și la exfiltrarea tokenurilor.\n\n👉 <strong>Recomandat</strong>: Definiți în schimb prefixe explicite pentru URI-urile de redirecționare.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URL-uri CIMD{1} permise pentru înregistrarea clienților
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL-uri CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Ce este înregistrarea clienților prin CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Definește modul în care pot fi înregistrați clienți OAuth noi folosind linkuri CIMD (Client Initiated Metadata).\nO cerere de înregistrare a unui client prin CIMD permite crearea dinamică a unei noi aplicații client, folosind un link securizat bazat pe OAuth.\nOrice cerere de înregistrare care nu îndeplinește parametrii sau politicile necesare va fi respinsă.\nAstfel, numai aplicațiile client de încredere și configurate corect pot fi înregistrate în sistem. Fiecare cerere trebuie:\n\n- Să includă toate metadatele obligatorii ale clientului (de ex., URL-uri de redirecționare, domenii)\n- Să respecte regulile de securitate și validare configurate\n- Să provină dintr-o sursă de încredere sau autorizată\n\nℹ️ Notă: înregistrarea CIMD este folosită numai la integrarea clienților. Nu modifică și nu actualizează clienții existenți după ce sunt creați.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL-uri pentru înregistrarea clienților prin CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefix URL pentru înregistrarea clienților prin CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirmați adăugarea URL-ului CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Permiteți orice URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL-ul CIMD a fost salvat cu succes
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=URL-ul CIMD există deja
oauth.administration.clientsSelfRegistrationCIMD.delete=Ștergeți URL-ul CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Eliminați URL-ul CIMD permis
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configurație cu risc ridicat</strong>.\n\nPermiterea oricărui URL CIMD înseamnă că metadatele clienților pot fi încărcate din locații care nu sunt de încredere.\nAcest lucru poate duce la înregistrarea unor clienți rău intenționați, la falsificarea metadatelor sau la un comportament OAuth nesigur.\n\n👉 <strong>Recomandat</strong>: Restricționați prefixele URL CIMD permise doar la domenii de încredere.
oauth.administration.clientsAllowedCorsOrigins.title=Site-uri web permise pentru {0}accesul din browser{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Origini CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Ce sunt originile CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Definește ce site-uri web au permisiunea de a trimite cereri din browser către acest serviciu.\nDoar cererile care provin de la aceste domenii vor fi acceptate de browser. Astfel, API-urile dvs. sunt protejate împotriva apelurilor din aplicații web care nu sunt de încredere.\nFiecare origine trebuie să:\n- Includă doar protocol + domeniu + port (fără cale)\n- Folosească HTTPS (cu excepția dezvoltării locale, dacă este activată)\n\nℹ️ Notă: Cum sunt utilizate aceste setări\n\n- URL-uri de redirecționare permise (mai sus) → filtrează URL-urile de redirecționare permise la înregistrarea clientului\n- Origini CORS permise → controlează ce site-uri web pot apela API-uri dintr-un browser\n\nAceste setări sunt independente de configurația fiecărui client și acționează ca reguli globale de securitate.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Câmp pentru originea CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Adăugați o origine CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirmați adăugarea URL-ului de origine
oauth.administration.clientsAllowedCorsOrigins.allowAny=Permiteți orice origine
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Originea CORS este permisă automat, conform regulii care permite toate URL-urile de redirecționare
oauth.administration.clientsAllowedCorsOrigins.delete=Ștergeți URL-ul de origine
oauth.administration.clientsAllowedCorsOrigins.saved=Origine salvată cu succes
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Originea există deja
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regula pentru originile cererilor permise, moștenită din URL-urile de redirecționare existente
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Eliminați originea permisă
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configurație cu risc ridicat</strong>.\n\nPermiterea oricărei origini CORS acceptă cereri din browser de la domenii arbitrare către endpointurile OAuth. Acest lucru poate permite aplicațiilor web care nu sunt de încredere să participe la fluxurile OAuth și crește riscul de expunere sau de utilizare abuzivă a tokenurilor.\n\n👉 <strong>Recomandat</strong>: Restricționați originile permise doar la domeniile aplicațiilor de încredere.
