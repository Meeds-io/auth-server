oauth.administration.clientsSelfRegistrationDCR.title={0}DCR-Weiterleitungs-URLs{1} für die Client-Registrierung
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR-Weiterleitungs-URLs
oauth.administration.clientsSelfRegistrationDCR.tooltip=Was ist eine DCR-Weiterleitungs-URL?
oauth.administration.clientsSelfRegistrationDCR.description=Legt fest, welche Weiterleitungs-URLs zulässig sind, wenn sich ein neuer Client über DCR registriert.\n\nJede Client-Registrierungsanfrage mit einer Weiterleitungs-URL, die hier nicht aufgeführt ist, wird abgelehnt.\nSo wird sichergestellt, dass nur vertrauenswürdige Anwendungsendpunkte im System registriert werden können.\n\nJede URL muss:\n- exakt übereinstimmen (einschließlich Protokoll, Domain und Pfad)\n- HTTPS verwenden (außer in genehmigten Entwicklungsumgebungen)\n\nℹ️ Hinweis: Diese Liste wird nur bei der Client-Registrierung verwendet. Sie legt nicht automatisch die Weiterleitungs-URLs bestehender Clients fest.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Eingabe der Weiterleitungs-URL
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Geben Sie ein zulässiges Präfix für Weiterleitungs-URLs ein
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Bestätigen Sie das Hinzufügen der Weiterleitungs-URL
oauth.administration.clientsSelfRegistrationDCR.allowAny=Jede URL erlauben
oauth.administration.clientsSelfRegistrationDCR.saved=Weiterleitungs-URLs erfolgreich gespeichert
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Weiterleitungs-URL existiert bereits
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Erlaubte Weiterleitungs-URL entfernen
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Hochriskante Konfiguration</strong>.\n\nWenn die Validierung der Weiterleitungs-URIs deaktiviert wird, kann jeder Client Autorisierungsantworten empfangen.\nDies kann zur Kompromittierung von Konten und zum Abfluss von Tokens führen.\n\n👉 <strong>Empfohlen</strong>: Legen Sie stattdessen explizite Präfixe für Weiterleitungs-URIs fest.
oauth.administration.clientsSelfRegistrationCIMD.title=Erlaubte {0}CIMD-URLs{1} für die Client-Registrierung
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD-URLs
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Was ist die CIMD-Client-Registrierung?
oauth.administration.clientsSelfRegistrationCIMD.description=Legt fest, wie neue OAuth-Clients über CIMD-Links (Client Initiated Metadata) registriert werden können.\nEine CIMD-Client-Registrierungsanfrage ermöglicht es, eine neue Client-Anwendung dynamisch über einen sicheren OAuth-basierten Link zu erstellen.\nJede Registrierungsanfrage, die die erforderlichen Parameter oder Richtlinien nicht erfüllt, wird abgelehnt.\nSo wird sichergestellt, dass nur vertrauenswürdige und korrekt konfigurierte Client-Anwendungen im System registriert werden können. Jede Anfrage muss:\n\n- alle erforderlichen Client-Metadaten enthalten (z. B. Weiterleitungs-URLs, Scopes)\ndie konfigurierten Sicherheits- und Validierungsregeln einhalten\n- aus einer vertrauenswürdigen oder autorisierten Quelle stammen\n\nℹ️ Hinweis: Die CIMD-Registrierung wird nur beim Onboarding von Clients verwendet. Bestehende Clients werden nach ihrer Erstellung dadurch weder geändert noch aktualisiert.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD-Client-Registrierungs-URLs
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=URL-Präfix für die CIMD-Client-Registrierung
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Bestätigen Sie das Hinzufügen der CIMD-URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Jede URL erlauben
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD-URL erfolgreich gespeichert
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD-URL existiert bereits
oauth.administration.clientsSelfRegistrationCIMD.delete=CIMD-URL löschen
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Erlaubte CIMD-URL entfernen
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Hochriskante Konfiguration</strong>.\n\nWenn beliebige CIMD-URLs erlaubt werden, können Client-Metadaten von nicht vertrauenswürdigen Orten geladen werden.\nDies kann zur Registrierung schädlicher Clients, zum Fälschen von Metadaten oder zu unsicherem OAuth-Verhalten führen.\n\n👉 <strong>Empfohlen</strong>: Beschränken Sie die erlaubten CIMD-URL-Präfixe auf vertrauenswürdige Domains.
oauth.administration.clientsAllowedCorsOrigins.title=Erlaubte Websites für den {0}Browserzugriff{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS-Ursprünge
oauth.administration.clientsAllowedCorsOrigins.tooltip=Was sind CORS-Ursprünge?
oauth.administration.clientsAllowedCorsOrigins.description=Legt fest, welche Websites browserbasierte Anfragen an diesen Dienst senden dürfen.\nNur Anfragen von diesen Domains werden vom Browser akzeptiert. Dies schützt Ihre APIs vor Aufrufen durch nicht vertrauenswürdige Webanwendungen.\nJeder Ursprung muss:\n- Nur Protokoll + Domain + Port enthalten (kein Pfad)\n- HTTPS verwenden (außer für die lokale Entwicklung, falls aktiviert)\n\nℹ️ Hinweis: Wie diese Einstellungen verwendet werden\n\n- Zulässige Weiterleitungs-URLs (oben) → legt fest, welche Weiterleitungs-URLs bei der Client-Registrierung erlaubt sind\n- Zulässige CORS-Ursprünge → steuert, welche Websites APIs aus einem Browser aufrufen dürfen\n\nDiese Einstellungen sind unabhängig von der Konfiguration der einzelnen Clients und gelten als globale Sicherheitsregeln.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Eingabe des CORS-Ursprungs
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=CORS-Ursprung hinzufügen
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Hinzufügen der Ursprungs-URL bestätigen
oauth.administration.clientsAllowedCorsOrigins.allowAny=Jeden Ursprung zulassen
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Der CORS-Ursprung wird automatisch erlaubt, um der Regel zu entsprechen, dass alle Weiterleitungs-URLs erlaubt sind
oauth.administration.clientsAllowedCorsOrigins.delete=Ursprungs-URL löschen
oauth.administration.clientsAllowedCorsOrigins.saved=Ursprung erfolgreich gespeichert
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Ursprung existiert bereits
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regel für erlaubte Anfrageursprünge, übernommen aus bestehenden Weiterleitungs-URLs
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Den erlaubten Ursprung entfernen
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Hochriskante Konfiguration</strong>.\n\nWenn beliebige CORS-Ursprünge erlaubt werden, sind browserbasierte Anfragen von beliebigen Domains an OAuth-Endpunkte möglich. Dadurch können nicht vertrauenswürdige Webanwendungen an OAuth-Abläufen teilnehmen, und das Risiko, dass Tokens offengelegt oder missbraucht werden, steigt.\n\n👉 <strong>Empfohlen</strong>: Beschränken Sie die erlaubten Ursprünge auf vertrauenswürdige Anwendungsdomains.
