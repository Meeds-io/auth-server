oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.title={0}DCR Redirect URLs{1} for client registration
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.drwerTitle=DCR Redirect URLs
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.tooltip=What is a DCR Redirect URLs?
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.description=Defines which redirect URLs are allowed when a new client registers using DCR.\nAny client registration request containing a redirect URL not listed here will be rejected.\nThis helps ensure that only trusted application endpoints can be registered in the system.Each URL must:\n- Match exactly (including protocol, domain and path)\n- Use HTTPS (except for approved development environments)\n\nℹ️ Note: This list is used only during client registration. It does not automatically define the redirect URLs of existing clients.
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.inputTitle=Redirect URL input
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.inputPlaceholder=Enter a redirect URL prefix to allow
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.buttonTooltip=Confirm the addition of the redirect URL
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.whitelist=Redirect URLs Whitelist
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny.enabled=Redirect URLs are allowed to any OAuth Client. Newly registered clients will be hidden to end users by default
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.allowAny.disabled=Redirect URLs are restricted to whitelisted ones. Newly registered clients will be hidden to end users by default
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.saved=Redirect URLs saved successfully
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.alreadyExists=Redirect URL already exists
oauth.administration.clientsSelfRegistrationAllowedSelfRegistration.deleteTooltip=Remove the allowed redirect URL
oauth.administration.clientsSelfRegistrationCIMD.title={0}CIMD URLs{1} for client registration
oauth.administration.clientsSelfRegistrationCIMD.tooltip=What is CIMD Client Registration?
oauth.administration.clientsSelfRegistrationCIMD.description=Defines how new OAuth clients can be registered using CIMD (Client Initiated Metadata) links.\nA CIMD client registration request allows a new client application to be created dynamically using a secure OAuth-based link.\nAny registration request that does not meet the required parameters or policies will be rejected.\nThis helps ensure that only trusted and properly configured client applications can be registered in the system. Each request must:\n\n- Include all required client metadata (e.g., redirect URLs, scopes)\nComply with configured security and validation rules\n- Originate from a trusted or authorized source\n\nℹ️ Note: CIMD registration is used only during client onboarding. It does not modify or update existing clients after they are created.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD Client Registration URLs
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD Client Registration URL prefix
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationCIMD.whitelist=CIMD URLs Whitelist
oauth.administration.clientsSelfRegistrationCIMD.allowAny.enabled=CIMD URLs are allowed to any OAuth Client. Newly registered clients will be hidden to end users by default
oauth.administration.clientsSelfRegistrationCIMD.allowAny.disabled=CIMD URLs are restricted to whitelisted ones. Newly registered clients will be hidden to end users by default
oauth.administration.clientsSelfRegistrationCIMD.added=CIMD URL added successfully
oauth.administration.clientsSelfRegistrationCIMD.removed=CIMD URL removed successfully
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL already exists
oauth.administration.clientsSelfRegistrationCIMD.delete=Delete CIMD URL
oauth.administration.clientsAllowedCorsOrigins.title=Allowed websites for {0}browser access{1}
oauth.administration.clientsAllowedCorsOrigins.tooltip=What are cors origins?
oauth.administration.clientsAllowedCorsOrigins.description=Defines which websites are allowed to make browser-based requests to this service.\nOnly requests coming from these domains will be accepted by the browser. This protects your APIs from being called by untrusted web applications.\nEach origin must:\n- Include only protocol + domain + port (no path)\n- Use HTTPS (except for local development if enabled)\n\nℹ️ Note: How these settings are used\n\n- Allowed Redirect URLs (above) → filters which redirect URLs are permitted during client registration\n- Allowed CORS Origins → controls which websites can call APIs from a browser\n\nThese settings are independent from each client’s configuration and act as global security rules.
