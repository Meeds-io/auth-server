oauth.administration.clientsSelfRegistrationDCR.title={0}URL di reindirizzamento DCR{1} per la registrazione del client
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL di reindirizzamento DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Che cos'è un URL di reindirizzamento DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Definisce quali URL di reindirizzamento sono consentiti quando un nuovo client si registra tramite DCR.\n\nQualsiasi richiesta di registrazione di un client contenente un URL di reindirizzamento non elencato qui verrà rifiutata.\nIn questo modo solo gli endpoint di applicazioni attendibili possono essere registrati nel sistema.\n\nOgni URL deve:\n- Corrispondere esattamente (inclusi protocollo, dominio e percorso)\n- Usare HTTPS (tranne che per gli ambienti di sviluppo approvati)\n\nℹ️ Nota: questo elenco viene usato solo durante la registrazione del client. Non definisce automaticamente gli URL di reindirizzamento dei client esistenti.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Campo URL di reindirizzamento
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Inserisca un prefisso di URL di reindirizzamento da consentire
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Conferma l'aggiunta dell'URL di reindirizzamento
oauth.administration.clientsSelfRegistrationDCR.allowAny=Consenti qualsiasi URL
oauth.administration.clientsSelfRegistrationDCR.saved=URL di reindirizzamento salvati con successo
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=L'URL di reindirizzamento esiste già
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Rimuovi l'URL di reindirizzamento consentito
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configurazione ad alto rischio</strong>.\n\nDisattivare la convalida degli URI di reindirizzamento consente a qualsiasi client di ricevere risposte di autorizzazione.\nCiò può causare la compromissione degli account e l'esfiltrazione dei token.\n\n👉 <strong>Consigliato</strong>: definisca invece prefissi espliciti per gli URI di reindirizzamento.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URL CIMD{1} consentiti per la registrazione del client
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Che cos'è la registrazione dei client CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Definisce come i nuovi client OAuth possono essere registrati utilizzando i link CIMD (Client Initiated Metadata).\nUna richiesta di registrazione client CIMD consente di creare dinamicamente una nuova applicazione client utilizzando un collegamento sicuro basato su OAuth.\nQualsiasi richiesta di registrazione che non soddisfi i parametri o i criteri richiesti verrà respinta.\nQuesto aiuta a garantire che solo le applicazioni client affidabili e configurate correttamente possano essere registrate nel sistema. Ogni richiesta deve:\n\n- Includere tutti i metadati del client richiesti (ad es. URL di reindirizzamento, scope)\nEssere conforme alle regole di sicurezza e convalida configurate\n- Provenire da una fonte affidabile o autorizzata\n\nℹ️ Nota: la registrazione CIMD viene utilizzata solo durante l'onboarding del client. Non modifica né aggiorna i client esistenti dopo la loro creazione.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL di registrazione dei client CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefisso URL di registrazione dei client CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Conferma l'aggiunta dell'URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Consenti qualsiasi URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD salvato con successo
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=URL CIMD già esistente
oauth.administration.clientsSelfRegistrationCIMD.delete=Elimina URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Rimuovi l'URL CIMD consentito
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configurazione ad alto rischio</strong>.\n\nConsentire qualsiasi URL CIMD significa che i metadati del client possono essere caricati da posizioni non attendibili.\nCiò può causare la registrazione di client dannosi, lo spoofing dei metadati o un comportamento OAuth non sicuro.\n\n👉 <strong>Consigliato</strong>: limiti i prefissi di URL CIMD consentiti ai soli domini attendibili.
oauth.administration.clientsAllowedCorsOrigins.title=Siti web consentiti per l'{0}accesso dal browser{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Origini CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Che cosa sono le origini CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Definisce quali siti web sono autorizzati a fare richieste basate sul browser per questo servizio.\nSolo le richieste provenienti da questi domini saranno accettate dal browser. Questo protegge le Sue API dall'essere chiamate da applicazioni web non attendibili.\nOgni origine deve:\n- Includere solo protocollo + dominio + porta (nessun percorso)\n- Usare HTTPS (tranne che per lo sviluppo locale se abilitato)\n\ni Nota: Come queste impostazioni vengono utilizzate\n\n- URL di reindirizzamento consentiti (sopra) → filtri che reindirizzano gli URL sono permessi durante la registrazione del client\n- Autorizzati CORS Origins → controlla quali siti web possono chiamare le API da un browser\n\nQueste impostazioni sono indipendenti dalla configurazione di ogni cliente e agiscono come regole di sicurezza globale.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Campo origine CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Aggiungi origine CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Conferma l'aggiunta dell'URL di origine
oauth.administration.clientsAllowedCorsOrigins.allowAny=Consenti qualsiasi origine
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=L'origine CORS è consentita automaticamente in base alla regola che consente tutti gli URL di reindirizzamento
oauth.administration.clientsAllowedCorsOrigins.delete=Elimina URL di origine
oauth.administration.clientsAllowedCorsOrigins.saved=Origine salvata con successo
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Origine già esistente
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regola di origine delle richieste consentite ereditata dagli URL di reindirizzamento esistenti
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Rimuovi l'origine consentita
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configurazione ad alto rischio</strong>.\n\nConsentire qualsiasi origine CORS permette richieste dal browser verso gli endpoint OAuth da domini arbitrari. Ciò può consentire ad applicazioni web non attendibili di partecipare ai flussi OAuth e aumenta il rischio di esposizione o uso improprio dei token.\n\n👉 <strong>Consigliato</strong>: limiti le origini consentite ai soli domini di applicazioni attendibili.
