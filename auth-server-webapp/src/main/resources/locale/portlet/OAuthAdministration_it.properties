oauth.administration.clientsSelfRegistrationDCR.title={0}DCR Redirect URLs{1} for client registration
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR Redirect URLs
oauth.administration.clientsSelfRegistrationDCR.tooltip=What is a DCR Redirect URL?
oauth.administration.clientsSelfRegistrationDCR.description=Defines which redirect URLs are allowed when a new client registers using DCR.\n\nAny client registration request containing a redirect URL not listed here will be rejected.\nThis helps ensure that only trusted application endpoints can be registered in the system.\n\nEach URL must:\n- Match exactly (including protocol, domain and path)\n- Use HTTPS (except for approved development environments)\n\nℹ️ Note: This list is used only during client registration. It does not automatically define the redirect URLs of existing clients.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Redirect URL input
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Enter a redirect URL prefix to allow
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirm the addition of the redirect URL
oauth.administration.clientsSelfRegistrationDCR.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationDCR.saved=Redirect URLs saved successfully
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Redirect URL already exists
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Remove the allowed redirect URL
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>High Risk Configuration</strong>.\n\nDisabling redirect URI validation allows any client to receive authorization responses.\nThis can result in account compromise and token exfiltration.\n\n👉 <strong>Recommended</strong>: Define explicit redirect URI prefixes instead.
oauth.administration.clientsSelfRegistrationCIMD.title=Allowed {0}CIMD URLs{1} for client registration
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URLs
oauth.administration.clientsSelfRegistrationCIMD.tooltip=What is CIMD Client Registration?
oauth.administration.clientsSelfRegistrationCIMD.description=Definisce come i nuovi client OAuth possono essere registrati utilizzando i link CIMD (Client Initiated Metadata).\nUna richiesta di registrazione client CIMD consente di creare dinamicamente una nuova applicazione client utilizzando un collegamento sicuro basato su OAuth.\nQualsiasi richiesta di registrazione che non soddisfi i parametri o i criteri richiesti verrà respinta.\nQuesto aiuta a garantire che solo le applicazioni client affidabili e configurate correttamente possano essere registrate nel sistema. Ogni richiesta deve:\n\n- Includere tutti i metadati del client richiesti (ad es. URL di reindirizzamento, scope)\nEssere conforme alle regole di sicurezza e convalida configurate\n- Provenire da una fonte affidabile o autorizzata\n\nℹ️ Nota: la registrazione CIMD viene utilizzata solo durante l'onboarding del client. Non modifica né aggiorna i client esistenti dopo la loro creazione.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD Client Registration URLs
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD Client Registration URL prefix
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirm the addition of the CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Allow any URL
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL saved successfully
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL already exists
oauth.administration.clientsSelfRegistrationCIMD.delete=Delete CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Remove the allowed CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>High Risk Configuration</strong>.\n\nAllowing any CIMD URL means client metadata can be loaded from untrusted locations.\nThis may result in registration of malicious clients, metadata spoofing, or unsafe OAuth behavior.\n\n👉 <strong>Recommended</strong>: Restrict allowed CIMD URL prefixes to trusted domains only.
oauth.administration.clientsAllowedCorsOrigins.title=Allowed websites for {0}browser access{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Cors Origins
oauth.administration.clientsAllowedCorsOrigins.tooltip=What are cors origins?
oauth.administration.clientsAllowedCorsOrigins.description=Definisce quali siti web sono autorizzati a fare richieste basate sul browser per questo servizio.\nSolo le richieste provenienti da questi domini saranno accettate dal browser. Questo protegge le Sue API dall'essere chiamate da applicazioni web non attendibili.\nOgni origine deve:\n- Includere solo protocollo + dominio + porta (nessun percorso)\n- Usare HTTPS (tranne che per lo sviluppo locale se abilitato)\n\ni Nota: Come queste impostazioni vengono utilizzate\n\n- URL di reindirizzamento consentiti (sopra) → filtri che reindirizzano gli URL sono permessi durante la registrazione del client\n- Autorizzati CORS Origins → controlla quali siti web possono chiamare le API da un browser\n\nQueste impostazioni sono indipendenti dalla configurazione di ogni cliente e agiscono come regole di sicurezza globale.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Cors origin input
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Add Cors Origin
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirm the addition of the Origin URL
oauth.administration.clientsAllowedCorsOrigins.allowAny=Allow any origin
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Cors Origin is automatically allowed to fit the rule of allowing all redirect URLs
oauth.administration.clientsAllowedCorsOrigins.delete=Delete Origin URL
oauth.administration.clientsAllowedCorsOrigins.saved=Origin saved successfully
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Origin already exists
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Allowed requests origin rule inherited from existing Redirect URLs
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Remove the allowed Origin
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>High Risk Configuration</strong>.\n\nAllowing any CORS origin permits browser-based requests from arbitrary domains to OAuth endpoints. This may enable untrusted web applications to participate in OAuth flows and increases the risk of token exposure or misuse..\n\n👉 <strong>Recommended</strong>: Restrict allowed origins to trusted application domains only.
