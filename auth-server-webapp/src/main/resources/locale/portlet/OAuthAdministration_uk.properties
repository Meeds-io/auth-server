oauth.administration.clientsSelfRegistrationDCR.title={0}URL-адреси перенаправлення DCR{1} для реєстрації клієнтів
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL-адреси перенаправлення DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Що таке URL-адреса перенаправлення DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Визначає, які URL-адреси переспрямування дозволені, коли новий клієнт реєструється за допомогою DCR.\n\nБудь-який запит на реєстрацію клієнта з URL-адресою переспрямування, якої немає в цьому списку, буде відхилено.\nЦе гарантує, що в системі можна зареєструвати лише довірені кінцеві точки застосунків.\n\nКожна URL-адреса має:\n- точно збігатися (включно з протоколом, доменом і шляхом)\n- використовувати HTTPS (крім схвалених середовищ розробки)\n\nℹ️ Примітка: цей список використовується лише під час реєстрації клієнта. Він не визначає автоматично URL-адреси переспрямування наявних клієнтів.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Поле URL-адреси перенаправлення
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Введіть префікс URL-адреси перенаправлення, який слід дозволити
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Підтвердіть додавання URL-адреси перенаправлення
oauth.administration.clientsSelfRegistrationDCR.allowAny=Дозволити будь-яку URL-адресу
oauth.administration.clientsSelfRegistrationDCR.saved=URL-адреси перенаправлень успішно збережено
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=URL-адреса перенаправлення вже існує
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Видалити дозволену URL-адресу перенаправлення
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Конфігурація високого ризику</strong>.\n\nВимкнення перевірки URI перенаправлення дозволяє будь-якому клієнту отримувати відповіді авторизації.\nЦе може призвести до компрометації облікових записів і викрадення токенів.\n\n👉 <strong>Рекомендовано</strong>: натомість визначте явні префікси URI перенаправлення.
oauth.administration.clientsSelfRegistrationCIMD.title=Дозволені {0}URL-адреси CIMD{1} для реєстрації клієнтів
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL-адреси CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Що таке реєстрація клієнтів CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Визначає, як нові клієнти OAuth можуть реєструватися за допомогою посилань CIMD (Client Initiated Metadata).\nЗапит на реєстрацію клієнта CIMD дає змогу динамічно створити новий клієнтський застосунок за допомогою захищеного посилання на основі OAuth.\nБудь-який запит на реєстрацію, що не відповідає обов’язковим параметрам або політикам, буде відхилено.\nЦе гарантує, що в системі можна зареєструвати лише довірені та правильно налаштовані клієнтські застосунки. Кожен запит має:\n\n- містити всі обов’язкові метадані клієнта (наприклад, URL-адреси переспрямування, області доступу)\n- відповідати налаштованим правилам безпеки та перевірки\n- надходити з довіреного або авторизованого джерела\n\nℹ️ Примітка: реєстрація CIMD використовується лише під час підключення клієнта. Вона не змінює й не оновлює наявних клієнтів після їх створення.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL-адреси реєстрації клієнтів CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Префікс URL-адреси реєстрації клієнта CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Підтвердіть додавання URL-адреси CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Дозволити будь-яку URL-адресу
oauth.administration.clientsSelfRegistrationCIMD.saved=URL-адресу CIMD успішно збережено
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=URL-адреса CIMD вже існує
oauth.administration.clientsSelfRegistrationCIMD.delete=Видалити URL-адресу CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Видалити дозволену URL-адресу CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Конфігурація з високим ризиком</strong>.\n\nДозвіл будь-якої URL-адреси CIMD означає, що метадані клієнта можуть завантажуватися з недовірених місць.\nЦе може призвести до реєстрації зловмисних клієнтів, підробки метаданих або небезпечної поведінки OAuth.\n\n👉 <strong>Рекомендовано</strong>: дозвольте лише префікси URL-адрес CIMD довірених доменів.
oauth.administration.clientsAllowedCorsOrigins.title=Дозволені вебсайти для {0}доступу з браузера{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Джерела CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Що таке джерела CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Визначає, яким вебсайтам дозволено надсилати запити з браузера до цієї служби.\nБраузер прийматиме лише запити, що надходять із цих доменів. Це захищає ваші API від викликів з недовірених вебзастосунків.\nКожне джерело має:\n- містити лише протокол + домен + порт (без шляху)\n- використовувати HTTPS (крім локальної розробки, якщо її ввімкнено)\n\nℹ️ Примітка: як використовуються ці налаштування\n\n- Дозволені URL-адреси переспрямування (вище) → визначають, які URL-адреси переспрямування дозволені під час реєстрації клієнта\n- Дозволені джерела CORS → визначають, які вебсайти можуть викликати API з браузера\n\nЦі налаштування не залежать від конфігурації кожного клієнта й діють як глобальні правила безпеки.
