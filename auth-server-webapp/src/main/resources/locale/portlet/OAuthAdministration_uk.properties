oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Видалити дозволене джерело
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Конфігурація з високим ризиком</strong>.\n\nДозвіл будь-якого джерела CORS дає змогу надсилати запити з браузера з довільних доменів до кінцевих точок OAuth. Це може дозволити недовіреним вебзастосункам брати участь у процесах OAuth і підвищує ризик розкриття або зловживання токенами.\n\n👉 <strong>Рекомендовано</strong>: дозвольте лише джерела довірених доменів застосунків.
