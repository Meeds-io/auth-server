oauth.administration.clientsSelfRegistrationDCR.title=Klientų registracijos {0}DCR peradresavimo URL{1}
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR peradresavimo URL
oauth.administration.clientsSelfRegistrationDCR.tooltip=Kas yra DCR peradresavimo URL?
oauth.administration.clientsSelfRegistrationDCR.description=Nustato, kurie peradresavimo URL leidžiami, kai naujas klientas registruojasi naudodamas DCR.\n\nBet kokia kliento registracijos užklausa, kurioje yra čia nenurodytas peradresavimo URL, bus atmesta.\nTai padeda užtikrinti, kad sistemoje būtų galima registruoti tik patikimų programų galinius taškus.\n\nKiekvienas URL turi:\n- tiksliai sutapti (įskaitant protokolą, domeną ir kelią)\n- naudoti HTTPS (išskyrus patvirtintas kūrimo aplinkas)\n\nℹ️ Pastaba: šis sąrašas naudojamas tik registruojant klientą. Jis automatiškai nenustato esamų klientų peradresavimo URL.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Peradresavimo URL įvestis
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Įveskite leidžiamo peradresavimo URL prefiksą
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Patvirtinti peradresavimo URL pridėjimą
oauth.administration.clientsSelfRegistrationDCR.allowAny=Leisti bet kokį URL
oauth.administration.clientsSelfRegistrationDCR.saved=Peradresavimo URL sėkmingai išsaugoti
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Peradresavimo URL jau yra
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Pašalinti leidžiamą peradresavimo URL
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Didelės rizikos konfigūracija</strong>.\n\nIšjungus peradresavimo URI tikrinimą, bet kuris klientas gali gauti autorizacijos atsakymus.\nDėl to gali būti pažeistos paskyros ir nutekinti prieigos raktai.\n\n👉 <strong>Rekomenduojama</strong>: vietoj to nurodykite aiškius peradresavimo URI prefiksus.
oauth.administration.clientsSelfRegistrationCIMD.title=Klientų registracijai leidžiami {0}CIMD URL{1}
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Kas yra CIMD klientų registracija?
oauth.administration.clientsSelfRegistrationCIMD.description=Nustato, kaip naujus OAuth klientus galima registruoti naudojant CIMD (Client Initiated Metadata) nuorodas.\nCIMD kliento registracijos užklausa leidžia dinamiškai sukurti naują kliento programą naudojant saugią OAuth pagrindu veikiančią nuorodą.\nBet kokia registracijos užklausa, neatitinkanti reikiamų parametrų ar politikų, bus atmesta.\nTai padeda užtikrinti, kad sistemoje būtų galima registruoti tik patikimas ir tinkamai sukonfigūruotas klientų programas. Kiekviena užklausa turi:\n\n- apimti visus būtinus kliento metaduomenis (pvz., peradresavimo URL, aprėptis)\natitikti sukonfigūruotas saugos ir patvirtinimo taisykles\n- būti gauta iš patikimo ar įgalioto šaltinio\n\nℹ️ Pastaba: CIMD registracija naudojama tik pridedant klientą. Ji nekeičia ir neatnaujina esamų klientų po jų sukūrimo.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD klientų registracijos URL
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD klientų registracijos URL prefiksas
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Patvirtinti CIMD URL pridėjimą
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Leisti bet kokį URL
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL sėkmingai išsaugotas
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL jau yra
oauth.administration.clientsSelfRegistrationCIMD.delete=Ištrinti CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Pašalinti leidžiamą CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Didelės rizikos konfigūracija</strong>.\n\nLeidus bet kokį CIMD URL, kliento metaduomenys gali būti įkeliami iš nepatikimų vietų.\nDėl to gali būti užregistruoti kenkėjiški klientai, suklastoti metaduomenys arba OAuth gali veikti nesaugiai.\n\n👉 <strong>Rekomenduojama</strong>: leiskite tik patikimų domenų CIMD URL prefiksus.
oauth.administration.clientsAllowedCorsOrigins.title=Svetainės, kurioms leidžiama {0}prieiga per naršyklę{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS kilmės šaltiniai
oauth.administration.clientsAllowedCorsOrigins.tooltip=Kas yra CORS kilmės šaltiniai?
oauth.administration.clientsAllowedCorsOrigins.description=Nustato, kurioms svetainėms leidžiama siųsti užklausas šiai paslaugai per naršyklę.\nNaršyklė priims tik iš šių domenų gaunamas užklausas. Tai apsaugo jūsų API nuo iškvietimų iš nepatikimų žiniatinklio programų.\nKiekvienas kilmės šaltinis turi:\n- apimti tik protokolą + domeną + prievadą (be kelio)\n- naudoti HTTPS (išskyrus vietinę kūrimo aplinką, jei ji įgalinta)\n\nℹ️ Pastaba: kaip naudojami šie nustatymai\n\n- Leidžiami peradresavimo URL (aukščiau) → nustato, kurie peradresavimo URL leidžiami registruojant klientą\n- Leidžiami CORS kilmės šaltiniai → nustato, kurios svetainės gali kviesti API iš naršyklės\n\nŠie nustatymai nepriklauso nuo kiekvieno kliento konfigūracijos ir veikia kaip visuotinės saugos taisyklės.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=CORS kilmės šaltinio įvestis
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Pridėti CORS kilmės šaltinį
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Patvirtinti kilmės šaltinio URL pridėjimą
oauth.administration.clientsAllowedCorsOrigins.allowAny=Leisti bet kokį kilmės šaltinį
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=CORS kilmės šaltinis leidžiamas automatiškai pagal taisyklę, leidžiančią visus peradresavimo URL
oauth.administration.clientsAllowedCorsOrigins.delete=Ištrinti kilmės šaltinio URL
oauth.administration.clientsAllowedCorsOrigins.saved=Kilmės šaltinis sėkmingai išsaugotas
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Kilmės šaltinis jau yra
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Leidžiamų užklausų kilmės šaltinio taisyklė, paveldėta iš esamų peradresavimo URL
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Pašalinti leidžiamą kilmės šaltinį
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Didelės rizikos konfigūracija</strong>.\n\nLeidus bet kokį CORS kilmės šaltinį, OAuth galiniams taškams leidžiama siųsti užklausas per naršyklę iš bet kokių domenų. Dėl to nepatikimos žiniatinklio programos gali dalyvauti OAuth sraute, o prieigos raktų atskleidimo ar netinkamo naudojimo rizika padidėja.\n\n👉 <strong>Rekomenduojama</strong>: leiskite tik patikimus programų domenus.
