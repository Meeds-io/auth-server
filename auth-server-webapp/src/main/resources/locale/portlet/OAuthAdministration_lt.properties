
oauth.administration.clientsSelfRegistrationCIMD.title=Allowed {0}CIMD URLs{1} for client registration
oauth.administration.clientsSelfRegistrationCIMD.tooltip=What is CIMD Client Registration?
oauth.administration.clientsSelfRegistrationCIMD.description=Defines how new OAuth clients can be registered using CIMD (Client Initiated Metadata) links.\nA CIMD client registration request allows a new client application to be created dynamically using a secure OAuth-based link.\nAny registration request that does not meet the required parameters or policies will be rejected.\nThis helps ensure that only trusted and properly configured client applications can be registered in the system. Each request must:\n\n- Include all required client metadata (e.g., redirect URLs, scopes)\nComply with configured security and validation rules\n- Originate from a trusted or authorized source\n\nℹ️ Note: CIMD registration is used only during client onboarding. It does not modify or update existing clients after they are created.
