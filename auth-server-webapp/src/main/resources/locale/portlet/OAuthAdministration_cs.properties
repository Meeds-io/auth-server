oauth.administration.clientsSelfRegistrationDCR.title={0}Adresy URL přesměrování DCR{1} pro registraci klientů
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=Adresy URL přesměrování DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Co je adresa URL přesměrování DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Určuje, které adresy URL přesměrování jsou povoleny, když se nový klient registruje pomocí DCR.\n\nKaždá žádost o registraci klienta obsahující adresu URL přesměrování, která zde není uvedena, bude zamítnuta.\nTím je zajištěno, že v systému lze registrovat pouze důvěryhodné koncové body aplikací.\n\nKaždá adresa URL musí:\n- Přesně odpovídat (včetně protokolu, domény a cesty)\n- Používat HTTPS (kromě schválených vývojových prostředí)\n\nℹ️ Poznámka: Tento seznam se používá pouze při registraci klienta. Neurčuje automaticky adresy URL přesměrování existujících klientů.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Zadání adresy URL přesměrování
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Zadejte předponu adresy URL přesměrování, kterou chcete povolit
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Potvrdit přidání adresy URL přesměrování
oauth.administration.clientsSelfRegistrationDCR.allowAny=Povolit libovolnou URL
oauth.administration.clientsSelfRegistrationDCR.saved=Adresy URL přesměrování byly úspěšně uloženy
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Adresa URL přesměrování již existuje
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Odebrat povolenou adresu URL přesměrování
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Vysoce riziková konfigurace</strong>.\n\nVypnutí ověřování URI přesměrování umožňuje libovolnému klientovi přijímat autorizační odpovědi.\nTo může vést ke kompromitaci účtu a k úniku tokenů.\n\n👉 <strong>Doporučeno</strong>: Místo toho definujte explicitní předpony URI přesměrování.
oauth.administration.clientsSelfRegistrationCIMD.title=Povolené {0}adresy URL CIMD{1} pro registraci klientů
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=Adresy URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Co je registrace klientů CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Určuje, jak lze registrovat nové klienty OAuth pomocí odkazů CIMD (Client Initiated Metadata).\nŽádost o registraci klienta CIMD umožňuje dynamicky vytvořit novou klientskou aplikaci pomocí zabezpečeného odkazu založeného na OAuth.\nKaždá žádost o registraci, která nesplňuje požadované parametry nebo zásady, bude zamítnuta.\nTím je zajištěno, že v systému lze registrovat pouze důvěryhodné a správně nakonfigurované klientské aplikace. Každá žádost musí:\n\n- Obsahovat všechna požadovaná metadata klienta (např. adresy URL přesměrování, rozsahy)\n- Splňovat nastavená pravidla zabezpečení a ověřování\n- Pocházet z důvěryhodného nebo autorizovaného zdroje\n\nℹ️ Poznámka: Registrace CIMD se používá pouze při zapojování klienta. Po vytvoření klientů je nemění ani neaktualizuje.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=Adresy URL pro registraci klientů CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Předpona adresy URL pro registraci klientů CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Potvrdit přidání adresy URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Povolit libovolnou URL
oauth.administration.clientsSelfRegistrationCIMD.saved=Adresa URL CIMD byla úspěšně uložena
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=Adresa URL CIMD již existuje
oauth.administration.clientsSelfRegistrationCIMD.delete=Odstranit adresu URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Odebrat povolenou adresu URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Vysoce riziková konfigurace</strong>.\n\nPovolení libovolné adresy URL CIMD znamená, že metadata klientů lze načítat z nedůvěryhodných umístění.\nTo může vést k registraci škodlivých klientů, podvržení metadat nebo nebezpečnému chování OAuth.\n\n👉 <strong>Doporučeno</strong>: Omezte povolené předpony adres URL CIMD pouze na důvěryhodné domény.
oauth.administration.clientsAllowedCorsOrigins.title=Povolené weby pro {0}přístup z prohlížeče{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Zdroje CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Co jsou zdroje CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Určuje, které weby mohou odesílat požadavky na tuto službu z prohlížeče.\nProhlížeč přijme pouze požadavky přicházející z těchto domén. Tím jsou vaše API chráněna před voláním z nedůvěryhodných webových aplikací.\nKaždý zdroj musí:\n- Obsahovat pouze protokol + doménu + port (bez cesty)\n- Používat HTTPS (kromě místního vývoje, pokud je povolen)\n\nℹ️ Poznámka: Jak se tato nastavení používají\n\n- Povolené adresy URL přesměrování (výše) → určují, které adresy URL přesměrování jsou povoleny při registraci klienta\n- Povolené zdroje CORS → určují, které weby mohou volat API z prohlížeče\n\nTato nastavení jsou nezávislá na konfiguraci jednotlivých klientů a fungují jako globální pravidla zabezpečení.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Zadání zdroje CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Přidat zdroj CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Potvrdit přidání URL zdroje
oauth.administration.clientsAllowedCorsOrigins.allowAny=Povolit libovolný zdroj
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Zdroj CORS je automaticky povolen v souladu s pravidlem povolujícím všechny adresy URL přesměrování
oauth.administration.clientsAllowedCorsOrigins.delete=Odstranit URL zdroje
oauth.administration.clientsAllowedCorsOrigins.saved=Zdroj byl úspěšně uložen
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Zdroj již existuje
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Pravidlo povolených zdrojů požadavků zděděné z existujících adres URL přesměrování
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Odebrat povolený zdroj
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Vysoce riziková konfigurace</strong>.\n\nPovolení libovolného zdroje CORS umožňuje požadavky z prohlížeče z libovolných domén na koncové body OAuth. To může nedůvěryhodným webovým aplikacím umožnit účast v tocích OAuth a zvyšuje riziko vyzrazení nebo zneužití tokenů.\n\n👉 <strong>Doporučeno</strong>: Omezte povolené zdroje pouze na důvěryhodné domény aplikací.
