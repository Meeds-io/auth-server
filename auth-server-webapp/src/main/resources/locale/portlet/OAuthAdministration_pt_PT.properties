oauth.administration.clientsSelfRegistrationDCR.title={0}URL de redirecionamento DCR{1} para o registo de clientes
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URLs de redirecionamento DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=O que é um URL de redirecionamento DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Define que URL de redirecionamento são permitidos quando um novo cliente se regista através de DCR.\n\nQualquer pedido de registo de cliente que contenha um URL de redirecionamento não indicado aqui será rejeitado.\nIsto ajuda a garantir que apenas endpoints de aplicações fidedignas podem ser registados no sistema.\n\nCada URL deve:\n- Corresponder exatamente (incluindo protocolo, domínio e caminho)\n- Utilizar HTTPS (exceto em ambientes de desenvolvimento aprovados)\n\nℹ️ Nota: esta lista é utilizada apenas durante o registo de clientes. Não define automaticamente os URL de redirecionamento dos clientes existentes.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Campo de URL de redirecionamento
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Insira um prefixo de URL de redirecionamento para permitir
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Confirme a adição do URL de redirecionamento
oauth.administration.clientsSelfRegistrationDCR.allowAny=Permitir qualquer URL
oauth.administration.clientsSelfRegistrationDCR.saved=URLs de redirecionamento guardados com sucesso
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=O URL de redirecionamento já existe
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Remover o URL de redirecionamento permitido
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nDesativar a validação do URI de redirecionamento permite que qualquer cliente receba respostas de autorização.\nIsto pode resultar no comprometimento de contas e na exfiltração de tokens.\n\n👉 <strong>Recomendado</strong>: em alternativa, defina prefixos explícitos de URI de redirecionamento.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URL CIMD{1} permitidos para o registo de clientes
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URLs CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=O que é o registo de clientes CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Define como podem ser registados novos clientes OAuth através de ligações CIMD (Client Initiated Metadata).\nUm pedido de registo de cliente CIMD permite criar dinamicamente uma nova aplicação cliente através de uma ligação segura baseada em OAuth.\nQualquer pedido de registo que não cumpra os parâmetros ou as políticas exigidas será rejeitado.\nIsto ajuda a garantir que apenas aplicações cliente fidedignas e corretamente configuradas podem ser registadas no sistema. Cada pedido deve:\n\n- Incluir todos os metadados de cliente obrigatórios (por exemplo, URL de redirecionamento, âmbitos)\nCumprir as regras de segurança e validação configuradas\n- Provir de uma origem fidedigna ou autorizada\n\nℹ️ Nota: o registo CIMD é utilizado apenas durante a integração de clientes. Não modifica nem atualiza os clientes existentes depois de criados.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL de registo de clientes CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefixo do URL de registo de clientes CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Confirme a adição do URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Permitir qualquer URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD guardado com sucesso
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=O URL CIMD já existe
oauth.administration.clientsSelfRegistrationCIMD.delete=Eliminar URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Remover o URL CIMD permitido
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nPermitir qualquer URL CIMD significa que os metadados de clientes podem ser carregados a partir de locais não fidedignos.\nIsto pode resultar no registo de clientes maliciosos, na falsificação de metadados ou num comportamento OAuth inseguro.\n\n👉 <strong>Recomendado</strong>: restrinja os prefixos de URL CIMD permitidos apenas a domínios fidedignos.
oauth.administration.clientsAllowedCorsOrigins.title=Sites permitidos para {0}acesso pelo navegador{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Origens CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=O que são origens CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Define que sítios web podem efetuar pedidos a este serviço a partir do navegador.\nApenas os pedidos provenientes destes domínios serão aceites pelo navegador. Isto protege as suas API contra chamadas de aplicações web não fidedignas.\nCada origem deve:\n- Incluir apenas protocolo + domínio + porta (sem caminho)\n- Utilizar HTTPS (exceto para desenvolvimento local, se ativado)\n\nℹ️ Nota: como estas definições são utilizadas\n\n- URL de redirecionamento permitidos (acima) → filtra os URL de redirecionamento permitidos durante o registo de clientes\n- Origens CORS permitidas → controla que sítios web podem chamar as API a partir de um navegador\n\nEstas definições são independentes da configuração de cada cliente e funcionam como regras de segurança globais.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Campo de origem CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Adicionar origem CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Confirme a adição do URL de origem
oauth.administration.clientsAllowedCorsOrigins.allowAny=Permitir qualquer origem
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=A origem CORS é permitida automaticamente para respeitar a regra que permite todos os URLs de redirecionamento
oauth.administration.clientsAllowedCorsOrigins.delete=Eliminar URL de origem
oauth.administration.clientsAllowedCorsOrigins.saved=Origem guardada com sucesso
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=A origem já existe
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regra de origem dos pedidos permitidos herdada dos URLs de redirecionamento existentes
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Remover a origem permitida
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Configuração de alto risco</strong>.\n\nPermitir qualquer origem CORS autoriza pedidos a partir do navegador, provenientes de domínios arbitrários, para os endpoints OAuth. Isto pode permitir que aplicações web não fidedignas participem em fluxos OAuth e aumenta o risco de exposição ou utilização indevida de tokens.\n\n👉 <strong>Recomendado</strong>: restrinja as origens permitidas apenas a domínios de aplicações fidedignas.
