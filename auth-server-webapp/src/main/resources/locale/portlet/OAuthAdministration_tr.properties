oauth.administration.clientsSelfRegistrationDCR.title=İstemci kaydı için {0}DCR yönlendirme URL'leri{1}
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR yönlendirme URL'leri
oauth.administration.clientsSelfRegistrationDCR.tooltip=DCR yönlendirme URL'si nedir?
oauth.administration.clientsSelfRegistrationDCR.description=Yeni bir istemci DCR kullanarak kaydolduğunda hangi yönlendirme URL'lerine izin verildiğini tanımlar.\n\nBurada listelenmeyen bir yönlendirme URL'si içeren her istemci kayıt isteği reddedilir.\nBu, sistemde yalnızca güvenilir uygulama uç noktalarının kaydedilebilmesini sağlar.\n\nHer URL:\n- Tam olarak eşleşmelidir (protokol, alan adı ve yol dahil)\n- HTTPS kullanmalıdır (onaylı geliştirme ortamları hariç)\n\nℹ️ Not: Bu liste yalnızca istemci kaydı sırasında kullanılır. Mevcut istemcilerin yönlendirme URL'lerini otomatik olarak tanımlamaz.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Yönlendirme URL'si girişi
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=İzin verilecek bir yönlendirme URL'si öneki girin
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Yönlendirme URL'sinin eklenmesini onaylayın
oauth.administration.clientsSelfRegistrationDCR.allowAny=Her URL'ye izin ver
oauth.administration.clientsSelfRegistrationDCR.saved=Yönlendirme URL'leri başarıyla kaydedildi
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Yönlendirme URL'si zaten mevcut
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=İzin verilen yönlendirme URL'sini kaldır
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Yüksek riskli yapılandırma</strong>.\n\nYönlendirme URI doğrulamasını devre dışı bırakmak, herhangi bir istemcinin yetkilendirme yanıtlarını almasına olanak tanır.\nBu durum hesabın ele geçirilmesine ve belirteçlerin sızdırılmasına yol açabilir.\n\n👉 <strong>Önerilen</strong>: Bunun yerine açık yönlendirme URI önekleri tanımlayın.
oauth.administration.clientsSelfRegistrationCIMD.title=İstemci kaydı için izin verilen {0}CIMD URL'leri{1}
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD URL'leri
oauth.administration.clientsSelfRegistrationCIMD.tooltip=CIMD istemci kaydı nedir?
oauth.administration.clientsSelfRegistrationCIMD.description=Yeni OAuth istemcilerinin CIMD (Client Initiated Metadata) bağlantıları kullanılarak nasıl kaydedilebileceğini tanımlar.\nCIMD istemci kayıt isteği, güvenli OAuth tabanlı bir bağlantı kullanılarak yeni bir istemci uygulamasının dinamik olarak oluşturulmasını sağlar.\nGerekli parametreleri veya politikaları karşılamayan her kayıt isteği reddedilir.\nBu, sistemde yalnızca güvenilir ve doğru yapılandırılmış istemci uygulamalarının kaydedilebilmesini sağlar. Her istek:\n\n- Gerekli tüm istemci meta verilerini içermelidir (ör. yönlendirme URL'leri, kapsamlar)\nYapılandırılmış güvenlik ve doğrulama kurallarına uymalıdır\n- Güvenilir veya yetkili bir kaynaktan gelmelidir\n\nℹ️ Not: CIMD kaydı yalnızca istemci ekleme sırasında kullanılır. Oluşturulduktan sonra mevcut istemcileri değiştirmez veya güncellemez.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=CIMD istemci kayıt URL'leri
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=CIMD istemci kayıt URL'si öneki
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=CIMD URL'sinin eklenmesini onaylayın
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Her URL'ye izin ver
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD URL'si başarıyla kaydedildi
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD URL'si zaten mevcut
oauth.administration.clientsSelfRegistrationCIMD.delete=CIMD URL'sini sil
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=İzin verilen CIMD URL'sini kaldır
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Yüksek riskli yapılandırma</strong>.\n\nHer CIMD URL'sine izin vermek, istemci meta verilerinin güvenilmeyen konumlardan yüklenebileceği anlamına gelir.\nBu durum kötü niyetli istemcilerin kaydedilmesine, meta veri sahteciliğine veya güvenli olmayan OAuth davranışına yol açabilir.\n\n👉 <strong>Önerilen</strong>: İzin verilen CIMD URL öneklerini yalnızca güvenilir alan adlarıyla sınırlayın.
oauth.administration.clientsAllowedCorsOrigins.title={0}Tarayıcı erişimi{1} için izin verilen web siteleri
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS kaynakları
oauth.administration.clientsAllowedCorsOrigins.tooltip=CORS kaynakları nedir?
oauth.administration.clientsAllowedCorsOrigins.description=Bu hizmete tarayıcı tabanlı istek göndermesine izin verilen web sitelerini tanımlar.\nTarayıcı yalnızca bu alan adlarından gelen istekleri kabul eder. Bu, API'lerinizin güvenilmeyen web uygulamaları tarafından çağrılmasını önler.\nHer kaynak:\n- Yalnızca protokol + alan adı + port içermelidir (yol olmadan)\n- HTTPS kullanmalıdır (etkinleştirilmişse yerel geliştirme hariç)\n\nℹ️ Not: Bu ayarlar nasıl kullanılır\n\n- İzin verilen yönlendirme URL'leri (yukarıda) → istemci kaydı sırasında hangi yönlendirme URL'lerine izin verildiğini filtreler\n- İzin verilen CORS kaynakları → hangi web sitelerinin bir tarayıcıdan API çağırabileceğini denetler\n\nBu ayarlar her istemcinin yapılandırmasından bağımsızdır ve genel güvenlik kuralları olarak işlev görür.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=CORS kaynağı girişi
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=CORS kaynağı ekle
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Kaynak URL'sinin eklenmesini onaylayın
oauth.administration.clientsAllowedCorsOrigins.allowAny=Her kaynağa izin ver
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Tüm yönlendirme URL'lerine izin verme kuralına uymak için CORS kaynağına otomatik olarak izin verilir
oauth.administration.clientsAllowedCorsOrigins.delete=Kaynak URL'sini sil
oauth.administration.clientsAllowedCorsOrigins.saved=Kaynak başarıyla kaydedildi
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Kaynak zaten mevcut
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Mevcut yönlendirme URL'lerinden devralınan izin verilen istek kaynağı kuralı
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=İzin verilen kaynağı kaldır
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Yüksek riskli yapılandırma</strong>.\n\nHer CORS kaynağına izin vermek, rastgele alan adlarından OAuth uç noktalarına tarayıcı tabanlı isteklere izin verir. Bu, güvenilmeyen web uygulamalarının OAuth akışlarına katılmasını sağlayabilir ve belirteçlerin açığa çıkması veya kötüye kullanılması riskini artırır.\n\n👉 <strong>Önerilen</strong>: İzin verilen kaynakları yalnızca güvenilir uygulama alan adlarıyla sınırlayın.
