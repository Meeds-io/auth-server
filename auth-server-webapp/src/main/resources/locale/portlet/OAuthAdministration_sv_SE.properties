oauth.administration.clientsSelfRegistrationDCR.title={0}DCR-omdirigerings-URL:er{1} för klientregistrering
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=DCR-omdirigerings-URL:er
oauth.administration.clientsSelfRegistrationDCR.tooltip=Vad är en DCR-omdirigerings-URL?
oauth.administration.clientsSelfRegistrationDCR.description=Anger vilka omdirigerings-URL:er som tillåts när en ny klient registreras via DCR.\n\nEn begäran om klientregistrering som innehåller en omdirigerings-URL som inte finns i listan avvisas.\nDetta säkerställer att endast betrodda appslutpunkter kan registreras i systemet.\n\nVarje URL måste:\n- Matcha exakt (inklusive protokoll, domän och sökväg)\n- Använda HTTPS (utom för godkända utvecklingsmiljöer)\n\nℹ️ Obs! Listan används endast vid klientregistrering. Den definierar inte automatiskt omdirigerings-URL:erna för befintliga klienter.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Inmatning av omdirigerings-URL
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Ange ett prefix för omdirigerings-URL som ska tillåtas
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Bekräfta tillägget av omdirigerings-URL
oauth.administration.clientsSelfRegistrationDCR.allowAny=Tillåt alla URL:er
oauth.administration.clientsSelfRegistrationDCR.saved=Omdirigerings-URL:erna har sparats
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=Omdirigerings-URL:en finns redan
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Ta bort den tillåtna omdirigerings-URL:en
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Högriskkonfiguration</strong>.\n\nOm valideringen av omdirigerings-URI inaktiveras kan alla klienter ta emot auktoriseringssvar.\nDetta kan leda till kontointrång och att tokens exfiltreras.\n\n👉 <strong>Rekommendation</strong>: Definiera i stället uttryckliga prefix för omdirigerings-URI.
oauth.administration.clientsSelfRegistrationCIMD.title=Tillåtna {0}CIMD-URL:er{1} för klientregistrering
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=CIMD-URL:er
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Vad är CIMD-klientregistrering?
oauth.administration.clientsSelfRegistrationCIMD.description=Anger hur nya OAuth-klienter kan registreras med CIMD-länkar (Client Initiated Metadata).\nEn begäran om CIMD-klientregistrering gör att en ny klientapp kan skapas dynamiskt via en säker OAuth-baserad länk.\nRegistreringsbegäranden som inte uppfyller de parametrar eller policyer som krävs avvisas.\nDetta säkerställer att endast betrodda och korrekt konfigurerade klientappar kan registreras i systemet. Varje begäran måste:\n\n- Innehålla alla obligatoriska klientmetadata (t.ex. omdirigerings-URL:er, omfång)\n- Följa de konfigurerade säkerhets- och valideringsreglerna\n- Komma från en betrodd eller auktoriserad källa\n\nℹ️ Obs! CIMD-registrering används endast när en klient registreras första gången. Den ändrar eller uppdaterar inte befintliga klienter efter att de har skapats.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL:er för CIMD-klientregistrering
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=URL-prefix för CIMD-klientregistrering
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Bekräfta tillägget av CIMD-URL:en
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Tillåt alla URL:er
oauth.administration.clientsSelfRegistrationCIMD.saved=CIMD-URL:en har sparats
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=CIMD-URL:en finns redan
oauth.administration.clientsSelfRegistrationCIMD.delete=Ta bort CIMD-URL
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Ta bort den tillåtna CIMD-URL:en
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Högriskkonfiguration</strong>.\n\nOm alla CIMD-URL:er tillåts kan klientmetadata läsas in från platser som inte är betrodda.\nDetta kan leda till registrering av skadliga klienter, förfalskade metadata eller osäkert OAuth-beteende.\n\n👉 <strong>Rekommendation</strong>: Begränsa tillåtna CIMD-URL-prefix till endast betrodda domäner.
oauth.administration.clientsAllowedCorsOrigins.title=Tillåtna webbplatser för {0}webbläsaråtkomst{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=CORS-ursprung
oauth.administration.clientsAllowedCorsOrigins.tooltip=Vad är CORS-ursprung?
oauth.administration.clientsAllowedCorsOrigins.description=Anger vilka webbplatser som får skicka webbläsarbaserade begäranden till den här tjänsten.\nEndast begäranden från dessa domäner accepteras av webbläsaren. Detta skyddar dina API:er från anrop av webbappar som inte är betrodda.\nVarje ursprung måste:\n- Endast innehålla protokoll + domän + port (ingen sökväg)\n- Använda HTTPS (utom för lokal utveckling om det är aktiverat)\n\nℹ️ Obs! Så används inställningarna\n\n- Tillåtna omdirigerings-URL:er (ovan) → filtrerar vilka omdirigerings-URL:er som tillåts vid klientregistrering\n- Tillåtna CORS-ursprung → styr vilka webbplatser som kan anropa API:er från en webbläsare\n\nDessa inställningar är oberoende av varje klients konfiguration och fungerar som globala säkerhetsregler.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Inmatning av CORS-ursprung
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Lägg till CORS-ursprung
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Bekräfta tillägget av ursprungs-URL:en
oauth.administration.clientsAllowedCorsOrigins.allowAny=Tillåt alla ursprung
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=CORS-ursprunget tillåts automatiskt enligt regeln som tillåter alla omdirigerings-URL:er
oauth.administration.clientsAllowedCorsOrigins.delete=Ta bort ursprungs-URL
oauth.administration.clientsAllowedCorsOrigins.saved=Ursprunget har sparats
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Ursprunget finns redan
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Regel för tillåtna ursprung, ärvd från befintliga omdirigerings-URL:er
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Ta bort det tillåtna ursprunget
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Högriskkonfiguration</strong>.\n\nOm alla CORS-ursprung tillåts kan webbläsarbaserade begäranden skickas från godtyckliga domäner till OAuth-slutpunkter. Det kan göra det möjligt för webbappar som inte är betrodda att delta i OAuth-flöden och ökar risken för att tokens exponeras eller missbrukas.\n\n👉 <strong>Rekommendation</strong>: Begränsa tillåtna ursprung till endast betrodda appdomäner.
