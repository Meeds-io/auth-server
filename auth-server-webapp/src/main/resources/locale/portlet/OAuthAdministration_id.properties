oauth.administration.clientsSelfRegistrationDCR.title={0}URL Pengalihan DCR{1} untuk pendaftaran klien
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL Pengalihan DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Apa itu URL Pengalihan DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Menentukan URL pengalihan mana yang diizinkan saat klien baru mendaftar menggunakan DCR.\n\nSetiap permintaan pendaftaran klien yang berisi URL pengalihan yang tidak tercantum di sini akan ditolak.\nHal ini membantu memastikan bahwa hanya endpoint aplikasi tepercaya yang dapat didaftarkan di sistem.\n\nSetiap URL harus:\n- Sama persis (termasuk protokol, domain, dan path)\n- Menggunakan HTTPS (kecuali untuk lingkungan pengembangan yang disetujui)\n\nℹ️ Catatan: Daftar ini hanya digunakan selama pendaftaran klien. Daftar ini tidak secara otomatis menentukan URL pengalihan klien yang sudah ada.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Input URL pengalihan
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Masukkan prefiks URL pengalihan yang akan diizinkan
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Konfirmasi penambahan URL pengalihan
oauth.administration.clientsSelfRegistrationDCR.allowAny=Izinkan URL apa pun
oauth.administration.clientsSelfRegistrationDCR.saved=URL pengalihan berhasil disimpan
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=URL pengalihan sudah ada
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Hapus URL pengalihan yang diizinkan
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Konfigurasi Berisiko Tinggi</strong>.\n\nMenonaktifkan validasi URI pengalihan memungkinkan klien mana pun menerima respons otorisasi.\nHal ini dapat mengakibatkan akun disusupi dan token dicuri.\n\n👉 <strong>Disarankan</strong>: Tentukan prefiks URI pengalihan secara eksplisit sebagai gantinya.
oauth.administration.clientsSelfRegistrationCIMD.title={0}URL CIMD{1} yang diizinkan untuk pendaftaran klien
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Apa itu Pendaftaran Klien CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Menentukan cara klien OAuth baru dapat didaftarkan menggunakan tautan CIMD (Client Initiated Metadata).\nPermintaan pendaftaran klien CIMD memungkinkan aplikasi klien baru dibuat secara dinamis menggunakan tautan berbasis OAuth yang aman.\nSetiap permintaan pendaftaran yang tidak memenuhi parameter atau kebijakan yang diperlukan akan ditolak.\nHal ini membantu memastikan bahwa hanya aplikasi klien yang tepercaya dan dikonfigurasi dengan benar yang dapat didaftarkan di sistem. Setiap permintaan harus:\n\n- Menyertakan semua metadata klien yang diperlukan (misalnya, URL pengalihan, cakupan)\nMematuhi aturan keamanan dan validasi yang dikonfigurasi\n- Berasal dari sumber yang tepercaya atau berwenang\n\nℹ️ Catatan: Pendaftaran CIMD hanya digunakan selama orientasi klien. Pendaftaran ini tidak mengubah atau memperbarui klien yang sudah ada setelah dibuat.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL Pendaftaran Klien CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Prefiks URL Pendaftaran Klien CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Konfirmasi penambahan URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Izinkan URL apa pun
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD berhasil disimpan
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=URL CIMD sudah ada
oauth.administration.clientsSelfRegistrationCIMD.delete=Hapus URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Hapus URL CIMD yang diizinkan
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Konfigurasi Berisiko Tinggi</strong>.\n\nMengizinkan URL CIMD apa pun berarti metadata klien dapat dimuat dari lokasi yang tidak tepercaya.\nHal ini dapat mengakibatkan pendaftaran klien berbahaya, pemalsuan metadata, atau perilaku OAuth yang tidak aman.\n\n👉 <strong>Disarankan</strong>: Batasi prefiks URL CIMD yang diizinkan hanya ke domain tepercaya.
oauth.administration.clientsAllowedCorsOrigins.title=Situs web yang diizinkan untuk {0}akses browser{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Origin CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Apa itu origin CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Menentukan situs web mana yang diizinkan membuat permintaan berbasis browser ke layanan ini.\nHanya permintaan yang berasal dari domain ini yang akan diterima oleh browser. Hal ini melindungi API Anda agar tidak dipanggil oleh aplikasi web yang tidak tepercaya.\nSetiap origin harus:\n- Hanya menyertakan protokol + domain + port (tanpa path)\n- Menggunakan HTTPS (kecuali untuk pengembangan lokal jika diaktifkan)\n\nℹ️ Catatan: Cara pengaturan ini digunakan\n\n- URL Pengalihan yang Diizinkan (di atas) → memfilter URL pengalihan mana yang diizinkan selama pendaftaran klien\n- Origin CORS yang Diizinkan → mengontrol situs web mana yang dapat memanggil API dari browser\n\nPengaturan ini tidak bergantung pada konfigurasi masing-masing klien dan berfungsi sebagai aturan keamanan global.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Input origin CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Tambahkan Origin CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Konfirmasi penambahan URL Origin
oauth.administration.clientsAllowedCorsOrigins.allowAny=Izinkan origin apa pun
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Origin CORS diizinkan secara otomatis untuk memenuhi aturan yang mengizinkan semua URL pengalihan
oauth.administration.clientsAllowedCorsOrigins.delete=Hapus URL Origin
oauth.administration.clientsAllowedCorsOrigins.saved=Origin berhasil disimpan
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Origin sudah ada
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Aturan origin permintaan yang diizinkan diwarisi dari URL Pengalihan yang sudah ada
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Hapus Origin yang diizinkan
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Konfigurasi Berisiko Tinggi</strong>.\n\nMengizinkan origin CORS apa pun memungkinkan permintaan berbasis browser dari domain sembarang ke endpoint OAuth. Hal ini dapat memungkinkan aplikasi web yang tidak tepercaya ikut serta dalam alur OAuth dan meningkatkan risiko token terekspos atau disalahgunakan.\n\n👉 <strong>Disarankan</strong>: Batasi origin yang diizinkan hanya ke domain aplikasi tepercaya.
