oauth.administration.clientsSelfRegistrationDCR.title={0}URL-адреса перенаправления DCR{1} для регистрации клиентов
oauth.administration.clientsSelfRegistrationDCR.drwerTitle=URL-адреса перенаправления DCR
oauth.administration.clientsSelfRegistrationDCR.tooltip=Что такое URL-адрес перенаправления DCR?
oauth.administration.clientsSelfRegistrationDCR.description=Определяет, какие URL-адреса перенаправления разрешены при регистрации нового клиента через DCR.\n\nЛюбой запрос на регистрацию клиента с URL-адресом перенаправления, которого нет в этом списке, будет отклонен.\nЭто гарантирует, что в системе могут быть зарегистрированы только доверенные конечные точки приложений.\n\nКаждый URL-адрес должен:\n- совпадать точно (включая протокол, домен и путь)\n- использовать HTTPS (кроме одобренных сред разработки)\n\nℹ️ Примечание: этот список используется только при регистрации клиента. Он не определяет автоматически URL-адреса перенаправления существующих клиентов.
oauth.administration.clientsSelfRegistrationDCR.inputTitle=Поле ввода URL перенаправления
oauth.administration.clientsSelfRegistrationDCR.inputPlaceholder=Введите разрешаемый префикс URL перенаправления
oauth.administration.clientsSelfRegistrationDCR.buttonTooltip=Подтвердите добавление URL перенаправления
oauth.administration.clientsSelfRegistrationDCR.allowAny=Разрешить любой URL
oauth.administration.clientsSelfRegistrationDCR.saved=URL-адреса перенаправления успешно сохранены
oauth.administration.clientsSelfRegistrationDCR.alreadyExists=URL перенаправления уже существует
oauth.administration.clientsSelfRegistrationDCR.deleteTooltip=Удалить разрешенный URL перенаправления
oauth.administration.clientsSelfRegistrationDCR.allowAny.warning=<strong>Конфигурация с высоким риском</strong>.\n\nОтключение проверки URI перенаправления позволяет любому клиенту получать ответы авторизации.\nЭто может привести к компрометации учетных записей и утечке токенов.\n\n👉 <strong>Рекомендуется</strong>: вместо этого задайте явные префиксы URI перенаправления.
oauth.administration.clientsSelfRegistrationCIMD.title=Разрешенные {0}URL-адреса CIMD{1} для регистрации клиентов
oauth.administration.clientsSelfRegistrationCIMD.drwerTitle=URL-адреса CIMD
oauth.administration.clientsSelfRegistrationCIMD.tooltip=Что такое регистрация клиентов CIMD?
oauth.administration.clientsSelfRegistrationCIMD.description=Определяет, как новые клиенты OAuth могут регистрироваться по ссылкам CIMD (Client Initiated Metadata).\nЗапрос на регистрацию клиента CIMD позволяет динамически создать новое клиентское приложение по защищенной ссылке на основе OAuth.\nЛюбой запрос на регистрацию, не соответствующий обязательным параметрам или политикам, будет отклонен.\nЭто гарантирует, что в системе могут быть зарегистрированы только доверенные и правильно настроенные клиентские приложения. Каждый запрос должен:\n\n- содержать все обязательные метаданные клиента (например, URL-адреса перенаправления, области доступа)\nсоответствовать настроенным правилам безопасности и проверки\n- поступать из доверенного или авторизованного источника\n\nℹ️ Примечание: регистрация CIMD используется только при подключении клиента. Она не изменяет и не обновляет существующих клиентов после их создания.
oauth.administration.clientsSelfRegistrationCIMD.inputTitle=URL-адреса регистрации клиентов CIMD
oauth.administration.clientsSelfRegistrationCIMD.inputPlaceholder=Префикс URL регистрации клиентов CIMD
oauth.administration.clientsSelfRegistrationCIMD.buttonTooltip=Подтвердите добавление CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny=Разрешить любой URL
oauth.administration.clientsSelfRegistrationCIMD.saved=URL CIMD успешно сохранен
oauth.administration.clientsSelfRegistrationCIMD.alreadyExists=URL-адрес CIMD уже существует
oauth.administration.clientsSelfRegistrationCIMD.delete=Удалить URL CIMD
oauth.administration.clientsSelfRegistrationCIMD.deleteTooltip=Удалить разрешенный CIMD URL
oauth.administration.clientsSelfRegistrationCIMD.allowAny.warning=<strong>Конфигурация с высоким риском</strong>.\n\nРазрешение любого URL CIMD означает, что метаданные клиента могут загружаться из ненадежных источников.\nЭто может привести к регистрации вредоносных клиентов, подделке метаданных или небезопасному поведению OAuth.\n\n👉 <strong>Рекомендуется</strong>: ограничьте разрешенные префиксы URL CIMD только доверенными доменами.
oauth.administration.clientsAllowedCorsOrigins.title=Разрешенные веб-сайты для {0}доступа из браузера{1}
oauth.administration.clientsAllowedCorsOrigins.drwerTitle=Источники CORS
oauth.administration.clientsAllowedCorsOrigins.tooltip=Что такое источники CORS?
oauth.administration.clientsAllowedCorsOrigins.description=Определяет, каким веб-сайтам разрешено отправлять запросы к этой службе из браузера.\nБраузер будет принимать только запросы с этих доменов. Это защищает ваши API от вызовов из ненадежных веб-приложений.\nКаждый источник должен:\n- содержать только протокол + домен + порт (без пути)\n- использовать HTTPS (кроме локальной разработки, если она включена)\n\nℹ️ Примечание: как используются эти настройки\n\n- Разрешенные URL-адреса перенаправления (выше) → определяют, какие URL-адреса перенаправления допускаются при регистрации клиента\n- Разрешенные источники CORS → определяют, какие веб-сайты могут вызывать API из браузера\n\nЭти настройки не зависят от конфигурации каждого клиента и действуют как глобальные правила безопасности.
oauth.administration.clientsAllowedCorsOrigins.inputTitle=Поле ввода источника CORS
oauth.administration.clientsAllowedCorsOrigins.inputPlaceholder=Добавить источник CORS
oauth.administration.clientsAllowedCorsOrigins.buttonTooltip=Подтвердите добавление URL источника
oauth.administration.clientsAllowedCorsOrigins.allowAny=Разрешить любой источник
oauth.administration.clientsAllowedCorsOrigins.disabled.tooltip=Источник CORS разрешается автоматически в соответствии с правилом, разрешающим все URL-адреса перенаправления
oauth.administration.clientsAllowedCorsOrigins.delete=Удалить URL источника
oauth.administration.clientsAllowedCorsOrigins.saved=Источник успешно сохранен
oauth.administration.clientsAllowedCorsOrigins.alreadyExists=Источник уже существует
oauth.administration.clientsAllowedCorsOrigins.readonlyOrigin=Правило разрешенных источников запросов, унаследованное от существующих URL-адресов перенаправления
oauth.administration.clientsAllowedCorsOrigins.deleteTooltip=Удалить разрешенный источник
oauth.administration.clientsAllowedCorsOrigins.allowAny.warning=<strong>Конфигурация с высоким риском</strong>.\n\nРазрешение любого источника CORS допускает запросы из браузера с произвольных доменов к конечным точкам OAuth. Это может позволить ненадежным веб-приложениям участвовать в процессах OAuth и повышает риск раскрытия или неправомерного использования токенов.\n\n👉 <strong>Рекомендуется</strong>: ограничьте разрешенные источники только доверенными доменами приложений.
